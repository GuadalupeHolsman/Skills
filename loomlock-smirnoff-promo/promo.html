<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(Anton-Regular.ttf)}
@font-face{font-family:Bebas;src:url(BebasNeue-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0;will-change:transform}
.anton{font-family:Anton;text-transform:uppercase}
.bebas{font-family:Bebas}
img{display:block}
</style></head>
<body><div id="stage">
<canvas id="cv" width="1080" height="1920"></canvas>

<!-- Acto 1: palabras de ruido -->
<div class="t anton" id="noiseWord" style="top:760px;font-size:300px;line-height:1;color:#fff"></div>

<!-- Acto 2: la key -->
<img id="mark" src="mark.svg" style="position:absolute;left:50%;top:50%;width:300px;opacity:0">

<!-- Acto 3a: Live now. Post later. -->
<div class="t anton" id="live" style="top:820px;font-size:210px;line-height:1;color:#fff">LIVE NOW.</div>
<div class="t anton" id="post" style="top:1040px;font-size:210px;line-height:1;color:#fff">POST LATER.</div>

<!-- Acto 3b: cierre co-branded -->
<img id="lockup" src="lockup.svg" style="position:absolute;left:190px;top:170px;width:700px;opacity:0">
<div class="t bebas" id="exp" style="top:440px;font-size:96px;letter-spacing:34px;padding-left:34px;color:#fff">EXPERIENCE</div>
<div class="t anton" id="x" style="top:540px;font-size:130px;color:#fff">×</div>
<div id="card" style="position:absolute;left:150px;width:780px;top:780px;height:330px;opacity:0;
  background:#d8141b;border:8px solid #fff;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center">
  <div class="anton" style="font-size:150px;line-height:1;color:#fff;margin-top:26px;letter-spacing:4px">SMIRNOFF</div>
  <div class="anton" style="font-size:96px;line-height:1;color:#ffc72c;margin-top:14px;letter-spacing:2px">SPICY TAMARINDO</div>
</div>
<div class="t" id="date" style="top:1330px"><span class="bebas" id="dateTxt" style="display:inline-block;font-size:84px;letter-spacing:5px;color:#3f49cc;background:#fff;border-radius:999px;padding:14px 52px 6px"></span></div>
<div class="t bebas" id="venue" style="top:1478px;font-size:72px;letter-spacing:8px;color:#fff"></div>
<div class="t bebas" id="cta" style="top:1576px;font-size:60px;letter-spacing:8px;color:#ffc72c"></div>
<div class="t bebas" id="legal" style="bottom:48px;font-size:34px;letter-spacing:3px;color:rgba(255,255,255,.85)">EVITA EL EXCESO · SOLO PARA MAYORES DE 18 AÑOS</div>
</div>

<script>
/* ==== DATOS DEL EVENTO: edita aquí ==== */
const EVENT = {
  fecha: "[DÍA] [FECHA] · [HORA]",
  lugar: "[LUGAR · CIUDAD]",
  cta:   "RSVP · @LOOMLOCK"
};
/* ===================================== */
dateTxt.textContent=EVENT.fecha; venue.textContent=EVENT.lugar; cta.textContent=EVENT.cta;

const W=1080,H=1920, cv=document.getElementById('cv'), c=cv.getContext('2d');
const BLUE='#3f49cc', BLUE_D='#2a318f';
const SPICY=['#e3191d','#ff6b1a','#ffc72c','#6b2a12','#2ba84a','#ffffff'];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const s=1.7;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ---------- ACTO 1 · RUIDO: cortes que se aceleran ---------- */
const NOISE_END=4.6;
const cuts=[0]; {let t=0,d=.55; while(t<NOISE_END){t+=d; cuts.push(t); d=Math.max(.1,d*.86);} }
const WORDS=['+99','PING','SCROLL','VISTO','OTRO MÁS','@','99+','NUEVO','REFRESH','•••'];

function pat(type,t,r,pal){
  const A=pal[0],B=pal[1],C=pal[2];
  c.fillStyle=A; c.fillRect(0,0,W,H);
  c.save();
  if(type===0){ // chevrons que corren
    const h=120, off=(t*900)%(h*2);
    for(let y=-h*2;y<H+h*2;y+=h){ c.fillStyle=((y/h)&1)?B:C; c.beginPath();
      for(let x=0;x<=W+90;x+=90){const yy=y+off+((x/90)&1?45:0); x===0?c.moveTo(x,yy):c.lineTo(x,yy);}
      for(let x=W+90;x>=0;x-=90){const yy=y+off+h/2+((x/90)&1?45:0); c.lineTo(x,yy);} c.fill(); }
  } else if(type===1){ // sol giratorio
    c.translate(W/2,H/2); c.rotate(t*2.2);
    for(let i=0;i<36;i++){c.fillStyle=i%2?B:C; c.beginPath(); c.moveTo(0,0);
      c.arc(0,0,2400,i*Math.PI/18,(i+1)*Math.PI/18); c.fill();}
  } else if(type===2){ // damero vibrando
    const s=90+40*Math.sin(t*30);
    for(let y=0;y<H/s+1;y++)for(let x=0;x<W/s+1;x++) if((x+y)&1){c.fillStyle=(x%3)?B:C;c.fillRect(x*s,y*s,s,s);}
  } else if(type===3){ // anillos
    const off=(t*500)%160;
    for(let rr=2400+off;rr>0;rr-=80){c.fillStyle=((rr-off)/80|0)%2?B:C;c.beginPath();c.arc(W/2,H/2,rr,0,7);c.fill();}
  } else if(type===4){ // semitono
    for(let y=0;y<H;y+=60)for(let x=0;x<W;x+=60){const d=Math.hypot(x-W/2,y-H/2);
      const rad=8+22*(.5+.5*Math.sin(d/60-t*14)); c.fillStyle=(x/60+y/60)%2?B:C; c.beginPath();c.arc(x+30,y+30,rad,0,7);c.fill();}
  } else if(type===5){ // rayas diagonales
    c.translate(W/2,H/2); c.rotate(-.6); const off=(t*1200)%140;
    for(let x=-1600;x<1600;x+=140){c.fillStyle=B;c.fillRect(x+off,-1600,60,3200);c.fillStyle=C;c.fillRect(x+off+70,-1600,22,3200);}
  } else { // papel picado
    for(let row=0;row<14;row++){const y=row*150-((t*600)%150), dir=row%2?1:-1;
      for(let x=-200;x<W+200;x+=100){const xx=x+dir*((t*500)%100); c.fillStyle=(row%2)?B:C;
        c.beginPath();c.moveTo(xx,y);c.lineTo(xx+100,y);c.lineTo(xx+50,y+120);c.fill();}}
  }
  c.restore();
}
function notifs(t,count,r){
  for(let i=0;i<count;i++){
    const rr=rng(i*7+3), w=760+rr()*160, x=(W-w)/2+(rr()-.5)*120, y=1700-i*86-(rr()*30);
    const age=t-i*.09, a=clamp(age*8);
    c.save(); c.globalAlpha=a*.96; c.translate(x+w/2,y); c.rotate((rr()-.5)*.12);
    c.fillStyle='#fff'; c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=24;
    const h=130; c.beginPath(); c.roundRect(-w/2,-h/2,w,h,34); c.fill(); c.shadowBlur=0;
    c.fillStyle=SPICY[i%5]; c.beginPath(); c.arc(-w/2+70,0,36,0,7); c.fill();
    c.fillStyle='#1b1b1b'; c.fillRect(-w/2+130,-28,w*.45,20); c.fillStyle='#9a9a9a'; c.fillRect(-w/2+130,10,w*.62,16);
    c.fillStyle='#e3191d'; c.beginPath(); c.arc(w/2-50,-h/2+10,30,0,7); c.fill();
    c.fillStyle='#fff'; c.font='34px Anton'; c.textAlign='center'; c.fillText(String(1+((i*7)%99)),w/2-50,-h/2+23);
    c.restore();
  }
}
function act1(t){
  let k=0; while(k+1<cuts.length&&cuts[k+1]<=t)k++;
  const r=rng(k+11), type=Math.floor(r()*7);
  const pal=[SPICY[(k)%5],SPICY[(k+2)%5],SPICY[(k+1)%6]];
  if(k%4===3){pal[0]='#0b0f3a';pal[1]=BLUE;pal[2]='#11163f';} // flash de "luz de pantalla"
  const sh=Math.pow(t/NOISE_END,2)*40;
  c.save(); c.translate((r()-.5)*sh,(r()-.5)*sh);
  pat(type,t,r,pal);
  notifs(t,Math.floor(t*4.2),r);
  c.restore();
  // palabra que parpadea
  const nw=document.getElementById('noiseWord');
  nw.textContent=WORDS[k%WORDS.length];
  nw.style.opacity=(k%2===0)?1:0;
  const g=(r()-.5)*30;
  nw.style.textShadow=`${g}px 0 #e3191d, ${-g}px 0 ${BLUE}, 0 10px 40px rgba(0,0,0,.4)`;
  nw.style.transform=`scale(${1+.15*r()}) rotate(${(r()-.5)*10}deg)`;
}

/* ---------- Tejido isométrico (telar) ---------- */
function isoGrid(t,alpha){
  c.save(); c.strokeStyle=`rgba(255,255,255,${alpha})`; c.lineWidth=2;
  const s=90, dy=(t*18)%s;
  for(let k=-30;k<40;k++){
    c.beginPath(); c.moveTo(0,k*s+dy); c.lineTo(W,k*s+dy+W*Math.tan(Math.PI/6)); c.stroke();
    c.beginPath(); c.moveTo(0,k*s+dy); c.lineTo(W,k*s+dy-W*Math.tan(Math.PI/6)); c.stroke();
  }
  c.restore();
}
function weave(t,start,y0,y1){
  const cols=[...SPICY.slice(0,5)], sw=60, gap=8, nWarp=Math.ceil(W/(sw+gap))+1, nWeft=Math.floor((y1-y0)/(sw+gap));
  // urdimbre (verticales) cae desde arriba
  for(let i=0;i<nWarp;i++){const p=eo(ramp(t,start+i*.02,start+.5+i*.02)); if(p<=0)continue;
    c.fillStyle=cols[i%5]; c.fillRect(i*(sw+gap),y0,sw,(y1-y0)*p);}
  // trama (horizontales) entra como lanzadera, fila por fila, alternando lado
  for(let j=0;j<nWeft;j++){const p=eio(ramp(t,start+.4+j*.09,start+.95+j*.09)); if(p<=0)continue;
    const y=y0+j*(sw+gap)+gap/2, dir=j%2?1:-1, len=W*p;
    c.fillStyle=cols[(j+2)%5];
    if(dir>0)c.fillRect(0,y,len,sw); else c.fillRect(W-len,y,len,sw);
    // cruce por encima/por debajo
    for(let i=0;i<nWarp;i++){ if((i+j)%2)continue; const x=i*(sw+gap);
      const covered = dir>0 ? x<len : x+sw>W-len; if(!covered)continue;
      c.fillStyle=cols[i%5]; c.fillRect(x,y-2,sw,sw+4);
      c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(x,y+sw-6,sw,6);}
  }
}

/* ---------- RENDER ---------- */
const $=id=>document.getElementById(id);
function show(el,t,a,dur=.45,dy=50,o=1){const p=eo(ramp(t,a,a+dur));el.style.opacity=p*o;el.style.transform=`translateY(${(1-p)*dy}px)`;}
function slam(el,t,a,dur=.3){const p=ramp(t,a,a+dur);el.style.opacity=p>0?1:0;el.style.transform=`scale(${1+(1-eo(p))*1.4})`;}
const hide=(...ids)=>ids.forEach(i=>$(i).style.opacity=0);

const TAP=5.9, WIPE_END=6.5, CLOSE=9.4;
window.render=function(t){
  hide('noiseWord','mark','live','post','lockup','exp','x','card','date','venue','cta');
  $('legal').style.opacity = t>=WIPE_END?1:0;
  c.setTransform(1,0,0,1,0,0);

  if(t<NOISE_END){ act1(t); return; }

  // silencio: negro
  c.fillStyle='#000'; c.fillRect(0,0,W,H);
  if(t<5.0) return;

  // la key aparece y hace tap
  if(t<WIPE_END+.6){
    const m=$('mark'); const inn=eo(ramp(t,5.0,5.6));
    let s=.85+.15*inn; if(t>=TAP) s*= 1-.08*Math.sin(clamp((t-TAP)/.18)*Math.PI);
    m.style.opacity=inn; m.style.transform=`translate(-50%,-50%) scale(${s})`;
    if(t>=TAP){ // onda + barrido azul
      const p=eio(ramp(t,TAP,WIPE_END)); c.fillStyle=BLUE; c.beginPath(); c.arc(W/2,H/2,p*1200,0,7); c.fill();
      for(let k=0;k<3;k++){const q=ramp(t,TAP+k*.08,TAP+.7+k*.08); if(q>0&&q<1){
        c.strokeStyle=`rgba(255,255,255,${1-q})`; c.lineWidth=10*(1-q)+2; c.beginPath(); c.arc(W/2,H/2,160+q*900,0,7); c.stroke();}}
    }
  }
  if(t<WIPE_END) return;

  // azul en calma con retícula isométrica
  c.fillStyle=BLUE; c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W/2,H*.45,100,W/2,H*.45,1300); g.addColorStop(0,'rgba(255,255,255,.08)'); g.addColorStop(1,'rgba(0,0,0,.25)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  isoGrid(t, .10*eo(ramp(t,WIPE_END,7.5)));

  if(t<CLOSE){
    const m=$('mark'); const up=eio(ramp(t,6.5,7.1));
    m.style.opacity=1-ramp(t,CLOSE-.3,CLOSE);
    m.style.transform=`translate(-50%,${-50-150*up}%) scale(${1-.45*up})`;
    show($('live'),t,7.1,.45,60); show($('post'),t,7.8,.45,60);
    const out=1-ramp(t,CLOSE-.3,CLOSE); $('live').style.opacity*=out; $('post').style.opacity*=out;
    return;
  }

  // cierre: tejido spicy + co-branding
  weave(t,CLOSE,690,1200);
  c.fillStyle='rgba(0,0,0,.0)';
  show($('lockup'),t,CLOSE+.1,.5,-40); $('lockup').style.transform+=' ';
  show($('exp'),t,CLOSE+.35,.5,-30);
  show($('x'),t,CLOSE+.9,.4,0);
  const cp=back(ramp(t,CLOSE+1.6,CLOSE+2.1)); const cd=$('card');
  cd.style.opacity=clamp(ramp(t,CLOSE+1.6,CLOSE+1.75)); cd.style.transform=`scale(${.6+.4*cp}) rotate(${(1-clamp(cp))*-6}deg)`;
  show($('date'),t,CLOSE+2.5,.45); show($('venue'),t,CLOSE+2.75,.45); show($('cta'),t,CLOSE+3.0,.45);
};
window.render(0);
</script>
</body></html>
