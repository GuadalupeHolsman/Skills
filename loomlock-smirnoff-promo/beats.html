<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Unbounded;src:url(Unbounded.ttf);font-weight:200 900}
@font-face{font-family:Mono;src:url(SpaceMono-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0;white-space:nowrap;line-height:1}
.head{font-family:Unbounded;font-weight:900;letter-spacing:-.02em;color:#fff}
.mono{font-family:Mono;font-weight:700;letter-spacing:.2em}
.mask{display:inline-block;overflow:hidden;padding:.06em .02em .1em;vertical-align:top}
.ch{display:inline-block}
img.lay{position:absolute;opacity:0}
</style></head>
<body><div id="stage">
<canvas id="cv" width="1080" height="1920"></canvas>
<img class="lay" id="mark" src="mark.svg" style="left:50%;top:50%;width:260px">
<img class="lay" id="lockup" src="lockup.svg" style="left:190px;top:150px;width:700px">
<div id="free"></div>
</div>
<script>
/* ==== EVENT DETAILS (invitation only): edit here ==== */
const EVENT = {
  day:   "[DAY]",          // e.g. FRIDAY
  date:  "[MONTH DD]",     // e.g. OCT 23
  time:  "[TIME]",         // e.g. 9 PM
  venue: "[VENUE]",
  city:  "[CITY]",
  rsvp:  "RSVP · [LINK]",
  legal: "ENJOY RESPONSIBLY · 18+ ONLY"
};
/* ==================================================== */
const $=id=>document.getElementById(id);
const W=1080,H=1920,c=$('cv').getContext('2d');
const NIGHT='#0a0c24',BLUE='#3f49cc',CHILI='#e3191d',AMBER='#ff7a1a',GOLD='#ffc72c',TAM='#5a2412';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ramp=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function rng(seed){let s=(seed*9301+49297)%233280;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ---------------- patterns (tonal, full bleed) ---------------- */
const SW=[CHILI,AMBER,GOLD,TAM,CHILI,GOLD], SF=[GOLD,CHILI,TAM,AMBER,GOLD,CHILI];
function weave(t,o){
  const {cx=W/2,cy=H/2,sp=72,w=56,warp=SW,weft=SF,shade=.25,L=1500,pw=()=>1,pf=()=>1}=o;
  c.save(); c.translate(cx,cy); c.rotate(-Math.PI/6); const n=Math.ceil(L/sp);
  const wl=i=>pw(i)*2*L, fl=j=>pf(j)*2*L, col=(a,i)=>a[((i%a.length)+a.length)%a.length];
  for(let i=-n;i<=n;i++){const l=wl(i); if(l>0){c.fillStyle=col(warp,i); c.fillRect(i*sp-w/2,-L,w,l);}}
  for(let j=-n;j<=n;j++){const l=fl(j); if(l<=0)continue; const y=j*sp-w/2, x0=(j&1)?-L:L-l;
    c.fillStyle=`rgba(0,0,0,${shade})`; c.fillRect(x0,y-4,l,w+8); c.fillStyle=col(weft,j); c.fillRect(x0,y,l,w);
    for(let i=-n;i<=n;i++){ if((i+j)&1)continue; const x=i*sp-w/2; if(x+w<x0||x>x0+l||-L+wl(i)<y+w)continue;
      c.fillStyle=`rgba(0,0,0,${shade})`; c.fillRect(x-4,y-2,w+8,w+4); c.fillStyle=col(warp,i); c.fillRect(x,y-2,w,w+4);}}
  c.restore();
}
const P={
  rings(t,lt,[bg,fg],cx,cy){fillAll(bg); c.strokeStyle=fg; c.lineWidth=8; for(let r=0;r<20;r++){const rr=((r*90+t*700)%1800); c.beginPath(); c.arc(cx,cy,rr,0,7); c.stroke();}},
  star(t,lt,[bg,fg],cx,cy){fillAll(bg); c.save(); c.translate(cx,cy); c.rotate(t*1.6);
    for(let r=6;r>0;r--){c.fillStyle=r%2?fg:bg; c.beginPath(); for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,R=r*260*(i%2?.82:1); c.lineTo(Math.cos(a)*R,Math.sin(a)*R);} c.fill();} c.restore();},
  heat(t,lt,[bg,fg],cx,cy){fillAll(bg); c.strokeStyle=fg; c.lineWidth=14; c.lineCap='round';
    for(let x=60;x<W;x+=120){c.beginPath(); for(let y=H+60;y>-60;y-=20){const yy=y-(t*900%240); c.lineTo(x+Math.sin(yy/70+x)*26,yy);} c.stroke();}},
  weave(t,lt,[bg],cx,cy,start){fillAll(bg); weave(t,{cx,cy,pw:i=>eo(ramp(t,start+(i+25)*.004,start+.25+(i+25)*.004)),pf:j=>eio(ramp(t,start+(j+25)*.004,start+.22+(j+25)*.004))});
    c.fillStyle='rgba(10,12,36,.3)'; c.fillRect(0,0,W,H);},
  grid(t,lt,[bg,fg],cx,cy){fillAll(bg); c.strokeStyle=fg; c.lineWidth=10; const p=eo(ramp(lt,0,.3));
    c.save(); c.translate(cx,cy); c.rotate(-Math.PI/6); c.globalAlpha=.25;
    for(let i=-14;i<=14;i++){c.beginPath(); c.moveTo(i*90,-1500*p); c.lineTo(i*90,1500*p); c.stroke(); c.beginPath(); c.moveTo(-1500*p,i*90); c.lineTo(1500*p,i*90); c.stroke();} c.restore();},
  sunburst(t,lt,[bg,fg],cx,cy){fillAll(bg); c.save(); c.translate(cx,cy); c.rotate(t*.5); c.fillStyle=fg;
    for(let i=0;i<32;i+=2){c.beginPath(); c.moveTo(0,0); c.arc(0,0,2400,i*Math.PI/16,(i+1)*Math.PI/16); c.fill();} c.restore();},
  chevron(t,lt,[bg,fg],cx,cy){fillAll(bg); c.fillStyle=fg; const h=140, off=(t*400)%(h*2);
    for(let y=-h*2;y<H+h*2;y+=h*2){c.beginPath(); for(let x=0;x<=W+90;x+=90){c.lineTo(x,y+off+((x/90)&1?50:0));}
      for(let x=W+90;x>=0;x-=90){c.lineTo(x,y+off+h+((x/90)&1?50:0));} c.fill();}},
  dots(t,lt,[bg,fg],cx,cy){fillAll(bg); c.fillStyle=fg; for(let y=0;y<H+60;y+=64)for(let x=((y/64)&1)*32;x<W+60;x+=64){const d=Math.hypot(x-cx,y-cy);
    c.beginPath(); c.arc(x,y,6+16*(.5+.5*Math.sin(d/70-t*9)),0,7); c.fill();}},
  stripes(t,lt,[bg,fg],cx,cy){fillAll(bg); c.save(); c.translate(cx,cy); c.rotate(-.6); c.fillStyle=fg; const off=(t*500)%160;
    for(let x=-1800;x<1800;x+=160)c.fillRect(x+off,-1800,70,3600); c.restore();},
  papel(t,lt,[bg,fg],cx,cy){fillAll(bg); c.fillStyle=fg; for(let row=0;row<16;row++){const y=row*150-((t*300)%150), d=row%2?1:-1;
    for(let x=-200;x<W+200;x+=110){const xx=x+d*((t*260)%110); c.beginPath(); c.moveTo(xx,y); c.lineTo(xx+110,y); c.lineTo(xx+55,y+120); c.fill();}}},
  checker(t,lt,[bg,fg],cx,cy){fillAll(bg); c.fillStyle=fg; const s=120, o=(t*160)%(s*2);
    for(let y=-2;y<H/s+2;y++)for(let x=-2;x<W/s+2;x++) if((x+y)&1)c.fillRect(x*s+o,y*s+o*.5,s,s);},
};
function fillAll(col){c.fillStyle=col; c.fillRect(-50,-50,W+100,H+100);}
function region(y0,y1,fn){c.save(); c.beginPath(); c.rect(0,y0,W,y1-y0); c.clip(); fn(); c.restore();}
const PAL={gold:[GOLD,'rgba(10,12,36,.22)'],gold2:[GOLD,'#f2ad12'],amber:[AMBER,'#ff9a3d'],chili:[CHILI,AMBER],chili2:[CHILI,'#c40f14'],
  blue:[BLUE,'#4c57dc'],night:[NIGHT,'#fff'],night2:[NIGHT,'#1c2156'],tam:[TAM,'#6e2f19']};

/* ---------------- text ---------------- */
const FREE={};
function K(id,text,css,cls='t head'){ if(!FREE[id]){const d=document.createElement('div'); d.className=cls; d.style.cssText+=';'+css;
  d.innerHTML=text.split('\n').map(l=>`<span class="mask">${[...l].map(ch=>`<span class="ch">${ch===' '?'&nbsp;':ch}</span>`).join('')}</span>`).join('<br>');
  $('free').appendChild(d); FREE[id]=d; fit(d,980);} return FREE[id]; }
function fit(el,maxW){ const w=Math.max(...[...el.querySelectorAll('.mask')].map(s=>s.getBoundingClientRect().width));
  if(w>maxW) el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)*maxW/w)+'px'; }
function kin(el,t,a,st=.012,dur=.16){ el.style.opacity=1; el.querySelectorAll('.ch').forEach((ch,i)=>{const p=eo(ramp(t,a+i*st,a+i*st+dur)); ch.style.transform=`translateY(${(1-p)*110}%)`;}); }
function punch(el,lt,len){ el.style.transform=`scale(${(1.08-.08*eo(ramp(lt,0,.25)))*(1+.03*lt/len)})`; }

/* ---------------- shots ----------------
   {b: beats, p: pattern, pal, txt, col, top, size, label, mark, tri:[...]} */
const B=.5;
function wordShot(txt,p,pal,col,o={}){return Object.assign({b:1,txt,p,pal,col},o);}
const FLAVOR=[ // the part you liked (original opening)
  wordShot('SWEET.','rings','gold',NIGHT), wordShot('TART.','star','amber','#fff'), wordShot('SPICY.','heat','chili',GOLD),
  wordShot('TAMARIND.','weave','tam','#fff'), wordShot('TAP.','rings','blue','#fff',{mark:1,top:1090,ringsOff:1}),
  wordShot('LOCK.','grid','night','#fff'), wordShot('LIVE.','weave','tam','#fff',{full:1})];
const BRAND=[
  wordShot('LOOMLOCK','sunburst','blue','#fff',{b:1}), wordShot('EXPERIENCES','dots','night2','#fff',{b:1}),
  wordShot('× SMIRNOFF','chevron','chili2','#fff',{b:1}), wordShot('SPICY\nTAMARIND','papel','gold2',CHILI,{b:1})];

const V={};
V.spicy={dur:10, shots:[...FLAVOR,...BRAND], end:'social'};
V.noise={dur:15, shots:[
  wordShot('PUT','dots','blue','#fff'), wordShot('YOUR','stripes','night2','#fff'), wordShot('PHONE','checker','blue','#fff'), wordShot('DOWN.','rings','chili2','#fff'),
  wordShot('TAP.','rings','blue','#fff',{b:2,mark:1,top:1090}), wordShot('LOCK.','grid','night','#fff'), wordShot('LIVE.','weave','tam','#fff',{full:1}),
  {b:3,tri:[['SWEET.','rings','gold',NIGHT],['TART.','star','amber','#fff'],['SPICY.','heat','chili',GOLD]]},
  wordShot('TAMARIND.','weave','tam','#fff'),
  wordShot('LIVE\nNOW.','chevron','blue','#fff',{b:2,size:300}), wordShot('POST\nLATER.','papel','gold2',NIGHT,{b:2,size:300}),
  wordShot('LOOMLOCK\nEXPERIENCES','sunburst','blue','#fff',{b:2}), wordShot('× SMIRNOFF\nSPICY TAMARIND','chevron','chili2','#fff',{b:2})],
  end:'social'};
V.invite={dur:20, shots:[
  wordShot("YOU'RE",'sunburst','blue','#fff'), wordShot('INVITED.','chevron','chili2',GOLD),
  {b:3,tri:[['SWEET.','rings','gold',NIGHT],['TART.','star','amber','#fff'],['SPICY.','heat','chili',GOLD]]},
  wordShot('TAMARIND.','weave','tam','#fff'),
  wordShot('TAP.','rings','blue','#fff',{mark:1,top:1090}), wordShot('LOCK.','grid','night','#fff'), wordShot('LIVE.','weave','tam','#fff',{full:1}),
  wordShot('LOOMLOCK\nEXPERIENCES','sunburst','blue','#fff',{b:2}), wordShot('× SMIRNOFF\nSPICY TAMARIND','chevron','chili2','#fff',{b:2}),
  wordShot(EVENT.day+'\n'+EVENT.date,'rings','gold',NIGHT,{b:4,label:'DATE'}),
  wordShot(EVENT.time,'dots','blue','#fff',{b:4,label:'DOORS'}),
  wordShot(EVENT.venue+'\n'+EVENT.city,'star','amber','#fff',{b:4,label:'VENUE'}),
  wordShot('TAP YOUR KEY\nAT THE DOOR.','grid','night','#fff',{b:3,size:150,label:'HOW IT WORKS'})],
  end:'invite'};

/* ---------------- end card: stacked pattern blocks ---------------- */
function endCard(t,S,kind){
  const lt=t-S, A=[0,700], Bk=[700,1220], C=[1220,1920];
  const pa=eio(ramp(lt,0,.35)), pb=eio(ramp(lt,.25,.6)), pc=eio(ramp(lt,.5,.85));
  fillAll(NIGHT);
  region(A[0],A[0]+(A[1]-A[0])*pa,()=>P.sunburst(t,lt,PAL.blue,W/2,350));
  c.save(); c.translate(-W*(1-pb),0); region(Bk[0],Bk[1],()=>P.chevron(t,lt,PAL.chili2,W/2,960)); c.restore();
  region(C[1]-(C[1]-C[0])*pc,C[1],()=>P.rings(t,lt,PAL.gold,W/2,1570));
  const lk=$('lockup'); const lp=eo(ramp(lt,.3,.7)); lk.style.opacity=lp; lk.style.transform=`translateY(${(1-lp)*-60}px)`;
  kin(K('eE','EXPERIENCES','top:450px;font-size:92px;color:#fff'),t,S+.45);
  kin(K('eS','× SMIRNOFF','top:780px;font-size:150px;color:#fff'),t,S+.7);
  kin(K('eT','SPICY TAMARIND','top:990px;font-size:110px;color:'+GOLD),t,S+.85);
  if(kind==='social'){
    kin(K('eL','LIVE NOW.\nPOST LATER.','top:1350px;font-size:140px;line-height:1.02;color:'+NIGHT),t,S+1.1);
  } else {
    kin(K('eD',`${EVENT.day} ${EVENT.date} · ${EVENT.time}`,'top:1300px;font-size:76px;color:'+NIGHT),t,S+1.0);
    kin(K('eV',`${EVENT.venue} · ${EVENT.city}`,'top:1410px;font-size:64px;color:'+NIGHT),t,S+1.2);
    const r=K('eR',EVENT.rsvp,`top:1540px;font-size:64px;color:${GOLD};background:${NIGHT};border-radius:999px;display:inline-block;left:50%;right:auto;transform-origin:0 0;padding:28px 60px 22px`);
    kin(r,t,S+1.5); r.style.transform=`translateX(-50%) scale(${.8+.2*eo(ramp(t,S+1.5,S+1.8))})`; r.style.opacity=ramp(t,S+1.5,S+1.6);
    kin(K('eLN','LIVE NOW. POST LATER.','top:1700px;font-size:44px;color:'+NIGHT),t,S+1.9);
  }
  const lg=K('eLG',EVENT.legal,'bottom:46px;top:auto;font-size:24px;color:'+NIGHT,'t mono'); lg.style.opacity=ramp(lt,.9,1.2); lg.querySelectorAll('.ch').forEach(ch=>ch.style.transform='');
}

/* ---------------- runtime ---------------- */
const VAR=V[(location.hash||'#spicy').slice(1)];
let starts=[], acc=0; VAR.shots.forEach(s=>{starts.push(acc); acc+=s.b*B;}); const END=acc;
window.DURATION=VAR.dur; window.SHOTS=starts.concat([END]);
window.ready=Promise.all(['900 100px Unbounded','700 30px Mono'].map(f=>document.fonts.load(f))).then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r))));
function drawWord(s,id,t,S,len){
  const lt=t-S;
  if(s.p==='weave') P.weave(t,lt,PAL[s.pal],W/2,H/2,s.full?-99:S); else P[s.p](t,lt,PAL[s.pal],W/2,H/2);
  if(s.mark){ const m=$('mark'); m.style.opacity=1; const sc=1-.12*Math.sin(clamp((lt-.05)/.14)*Math.PI);
    m.style.transform=`translate(-50%,-90%) scale(${sc*.9})`;
    fillAll(BLUE);
    for(let q=0;q<3;q++){const p=eo(ramp(lt,.05+q*.06,.45+q*.06)); if(p>0&&p<1){c.strokeStyle=`rgba(255,255,255,${1-p})`; c.lineWidth=4; c.beginPath(); c.arc(W/2,H/2-150,140+p*700,0,7); c.stroke();}} }
  if(s.label){ const lb=K(id+'L',s.label,'top:600px;font-size:52px;color:'+s.col,'t mono'); kin(lb,t,S,.01,.14); }
  const size=s.size||(s.txt.split('\n').some(l=>l.length>7)?200:280);
  const top=s.top||(s.label?720:(s.txt.includes('\n')?960-size*1.08:800));
  const w=K(id,s.txt,`top:${top}px;font-size:${size}px;line-height:1.05;color:${s.col}`); kin(w,t,S); punch(w,lt,len);
}
window.render=function(t){
  $('mark').style.opacity=0; $('lockup').style.opacity=0; Object.values(FREE).forEach(e=>e.style.opacity=0);
  c.setTransform(1,0,0,1,0,0);
  if(t>=END){ endCard(t,END,VAR.end); return; }
  let k=0; while(k+1<starts.length&&starts[k+1]<=t)k++;
  const s=VAR.shots[k], S=starts[k], len=s.b*B;
  if(s.tri){ // three stacked bands, one per beat
    fillAll(NIGHT);
    s.tri.forEach(([txt,p,pal,col],i)=>{ if(t<S+i*B)return; const y0=i*640, y1=y0+640;
      const pin=eio(ramp(t,S+i*B,S+i*B+.18));
      region(y0,y0+640*pin,()=>P[p](t,t-S,PAL[pal],W/2,(y0+y1)/2));
      const w=K('tri'+k+i,txt,`top:${y0+200}px;font-size:230px;color:${col}`); kin(w,t,S+i*B); punch(w,t-S-i*B,B); });
    return; }
  drawWord(s,'s'+k,t,S,len);
};
</script>
</body></html>
