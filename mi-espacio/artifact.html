<title>Mi Espacio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: barra lateral estilo Notion en la compu, barra inferior en el celu; páginas de tarjetas y listas. */
:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface-2: #efeee9; --text: #2f2e2b; --muted: #77746b; --border: #e4e2db;
  --accent: #2f6f5e; --accent-soft: #e1eee8; --on-accent: #ffffff;
  --income: #2f8f5b; --expense: #c0533a; --warn: #b97f0c; --danger: #c0392b;
  --work-bg: #e7ecf9; --work-fg: #3d5aa8; --late-bg: #fbe6e2; --late-fg: #b5352a;
  --soon-bg: #fbf0d9; --soon-fg: #8a5e08; --doing-bg: #efe6f7; --doing-fg: #7a46a0;
  --c1: #2f6f5e; --c2: #e0a03a; --c3: #c0533a; --c4: #5876c9; --c5: #9a64b8; --c6: #3e9fb0; --c7: #8a8f3c; --c8: #b8577e; --c9: #8c8a84;
  --shadow: 0 1px 2px rgba(40,38,30,.05), 0 4px 14px rgba(40,38,30,.05);
  --scrim: rgba(20,20,18,.38);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #191919; --surface: #222221; --surface-2: #2c2c2a; --text: #ebe9e4; --muted: #9b988f; --border: #363634;
  --accent: #6cc3a6; --accent-soft: #1f3530; --on-accent: #10201b;
  --income: #6cc38f; --expense: #ec8a6f; --warn: #e7b14a; --danger: #ef7465;
  --work-bg: #26304a; --work-fg: #9db3f0; --late-bg: #4a2620; --late-fg: #f19a8a;
  --soon-bg: #463818; --soon-fg: #f0c56b; --doing-bg: #3a2c47; --doing-fg: #cfa6ec;
  --c1: #6cc3a6; --c2: #e7b14a; --c3: #ec8a6f; --c4: #8aa4ef; --c5: #c497df; --c6: #6cc9d9; --c7: #c2c770; --c8: #e58fb3; --c9: #a6a39b;
  --shadow: none; --scrim: rgba(0,0,0,.55); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #191919; --surface: #222221; --surface-2: #2c2c2a; --text: #ebe9e4; --muted: #9b988f; --border: #363634;
  --accent: #6cc3a6; --accent-soft: #1f3530; --on-accent: #10201b;
  --income: #6cc38f; --expense: #ec8a6f; --warn: #e7b14a; --danger: #ef7465;
  --work-bg: #26304a; --work-fg: #9db3f0; --late-bg: #4a2620; --late-fg: #f19a8a;
  --soon-bg: #463818; --soon-fg: #f0c56b; --doing-bg: #3a2c47; --doing-fg: #cfa6ec;
  --c1: #6cc3a6; --c2: #e7b14a; --c3: #ec8a6f; --c4: #8aa4ef; --c5: #c497df; --c6: #6cc9d9; --c7: #c2c770; --c8: #e58fb3; --c9: #a6a39b;
  --shadow: none; --scrim: rgba(0,0,0,.55); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 15px; font-weight: 650; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .amount, .value { font-variant-numeric: tabular-nums; }

.app { display: flex; min-height: 100vh; }
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; width: 224px; flex: none;
  display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px));
  background: var(--surface-2); border-right: 1px solid var(--border);
}
.who { display: flex; align-items: center; gap: 10px; padding: 6px 10px; margin-bottom: 14px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; }
.who { cursor: default; }
.avatar { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--on-accent); background: var(--accent); flex: none; }
.who .nm { font-weight: 650; }
.who .sub { display: block; font-size: 12px; color: var(--muted); }
.nav .tab {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px;
  background: none; text-align: left; cursor: pointer; color: var(--muted);
}
.nav .tab:hover { background: var(--border); color: var(--text); }
.nav .tab.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.nav .ico { width: 22px; text-align: center; }
.badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--danger); color: var(--surface); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.nav .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); }

main { flex: 1; min-width: 0; max-width: 1180px; padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }

/* chip de persona: solo en el celu, donde no está la barra lateral */
.who-mobile { display: none !important; }
@media (max-width: 760px) {
  .app { display: block; }
  .nav {
    position: fixed; z-index: 10; top: auto; bottom: 0; left: 0; right: 0; width: auto; height: auto;
    flex-direction: row; justify-content: space-around; background: var(--surface);
    padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
    border-right: 0; border-top: 1px solid var(--border);
  }
  .who, .nav .foot { display: none; }
  .nav .tab { flex: 1; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; }
  .nav .tab.active { box-shadow: none; background: var(--accent-soft); }
  .nav .ico { font-size: 19px; }
  .badge { position: absolute; top: 2px; right: 18%; margin: 0; }
  main { padding-block: 16px calc(92px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 24px; }
  .who-mobile { display: inline-flex !important; }
}

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card { padding: 14px 16px; }
.card .label { color: var(--muted); font-size: 13px; }
.card .value { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card.link { cursor: pointer; }
.card.link:hover { border-color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid2 > .wide { grid-column: 1 / -1; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { padding: 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chart-box { position: relative; height: 240px; }
.empty { color: var(--muted); font-size: 14px; padding: 14px 6px; text-align: center; }
.pos { color: var(--income); } .neg { color: var(--expense); } .muted { color: var(--muted); }

.month-switch { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.month-switch span { min-width: 140px; text-align: center; font-weight: 600; }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--border); border-radius: 6px; }
.row:last-child { border-bottom: 0; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; }
.row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .amount { font-weight: 650; white-space: nowrap; }
.day-head { font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 12px 6px 2px; }

.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; background: var(--surface-2); color: var(--muted); }
.tag.work { background: var(--work-bg); color: var(--work-fg); }
.tag.personal, .tag.ok { background: var(--accent-soft); color: var(--accent); }
.tag.late { background: var(--late-bg); color: var(--late-fg); }
.tag.soon { background: var(--soon-bg); color: var(--soon-fg); }
.tag.doing { background: var(--doing-bg); color: var(--doing-fg); }
.tag.example { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--border); }
.prio { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.prio.alta { background: var(--danger); } .prio.media { background: var(--warn); } .prio.baja { background: var(--border); }

.check { width: 20px; height: 20px; flex: none; border-radius: 6px; border: 1.6px solid var(--muted); background: none; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; font-size: 13px; }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.done .title { text-decoration: line-through; color: var(--muted); }

.budget { display: block; padding: 8px 6px; }
.budget .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar { height: 7px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar i.warn { background: var(--warn); } .bar i.over { background: var(--danger); }

.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--border); }
.alert:last-child { border-bottom: 0; }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--accent); }
.alert.warn .dot { background: var(--warn); } .alert.late .dot { background: var(--danger); }
.alert .t { font-weight: 600; } .alert .b { color: var(--muted); font-size: 13.5px; }

.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.quick input[name=title] { flex: 1 1 220px; }
.quick input, .quick select { width: auto; }
.chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; border-radius: 99px; cursor: pointer; font-size: 13.5px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.group-title { display: flex; gap: 8px; font-size: 13px; font-weight: 650; color: var(--muted); margin: 16px 6px 4px; }

input, select, textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.field > span { font-weight: 550; }
.fields { display: grid; gap: 12px; }
.fields.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 480px) { .fields.two { grid-template-columns: 1fr; } }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 9px; gap: 3px; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; width: 1px; }
.seg label { text-align: center; padding: 6px; border-radius: 7px; cursor: pointer; font-weight: 550; color: var(--muted); }
.seg input:checked + label { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.switch:last-of-type { border-bottom: 0; }
.switch input { width: 40px; height: 22px; appearance: none; background: var(--border); border-radius: 99px; position: relative; cursor: pointer; flex: none; border: 0; padding: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.switch .desc { font-size: 12.5px; color: var(--muted); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline input { width: auto; flex: 1 1 160px; }
.hours { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
.help { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
.settings h2 + .help { margin-top: 4px; }
.settings .panel h2:not(:first-child) { margin-top: 18px; }

dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: var(--scrim); }
dialog header, dialog footer { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
dialog header { justify-content: space-between; border-bottom: 1px solid var(--border); }
dialog footer { border-top: 1px solid var(--border); flex-wrap: wrap; }
.spacer { flex: 1; }
.modal-body { padding: 16px; max-height: min(70vh, 640px); overflow: auto; }
@media (max-width: 760px) { dialog { margin: auto auto 0; width: 100vw; max-width: 100vw; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); } }

.people { display: grid; gap: 10px; }
.person { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.person:hover, .person.on { border-color: var(--accent); background: var(--accent-soft); }
.avatar.big { width: 36px; height: 36px; font-size: 15px; border-radius: 9px; }

.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 16px; border-radius: var(--radius); background: var(--accent-soft); font-size: 14px; }
.banner.soft { background: var(--surface-2); }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 760px) { #toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <nav class="nav" aria-label="Secciones">
    <div class="who"><span class="avatar">L</span><span><span class="nm">Lupe</span><span class="sub">Mi Espacio</span></span></div>
    <button class="tab" data-view="inicio" type="button"><span class="ico">🏠</span><span>Inicio</span><span class="badge" id="alert-badge" hidden></span></button>
    <button class="tab" data-view="finanzas" type="button"><span class="ico">💸</span><span>Finanzas</span></button>
    <button class="tab" data-view="laburo" type="button"><span class="ico">💼</span><span>Laburo</span></button>
    <button class="tab" data-view="personal" type="button"><span class="ico">🌱</span><span>Personal</span></button>
    <button class="tab" data-view="ajustes" type="button"><span class="ico">⚙️</span><span>Ajustes</span></button>
    <div class="foot" id="store-note"></div>
  </nav>
  <main id="view"><p class="muted">Cargando…</p></main>
</div>
<dialog id="modal"><form id="modal-form" method="dialog"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
// ---------- constantes ----------
const person = { key: 'lupe', name: 'Lupe' };
const EXPENSE_CATS = ['Comida', 'Súper', 'Transporte', 'Casa', 'Servicios', 'Salud', 'Salidas', 'Ropa', 'Suscripciones', 'Educación', 'Otros'];
const INCOME_CATS = ['Sueldo', 'Freelance', 'Ventas', 'Otros'];
const AREAS = { work: 'Laburo', personal: 'Personal' };
const PRIO = { alta: 'Alta', media: 'Media', baja: 'Baja' };
const PRIO_ORDER = { alta: 0, media: 1, baja: 2 };
const COLLS = ['tx', 'budgets', 'bills', 'tasks'];
const DEFAULT_SETTINGS = { rate: 1000, notif: { summary: true, tasks: true, bills: true, evening: true, budget: true }, summaryHour: 9, taskHour: 18, eveningHour: 21, billDaysBefore: 3 };

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const thisMonth = () => today().slice(0, 7);
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthName = (mk, short) => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-AR', short ? { month: 'short' } : { month: 'long', year: 'numeric' }); };
const prettyDay = s => cap(parseDate(s).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }));
const shortDay = s => parseDate(s).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, cur = 'ARS') => new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur, maximumFractionDigits: cur === 'USD' ? 2 : 0 }).format(n || 0);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { } };

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

// ---------- estado ----------
const state = { tx: [], budgets: [], bills: [], tasks: [], settings: structuredClone(DEFAULT_SETTINGS) };

function setSettingsFrom(obj) {
  const s = obj || {};
  state.settings = { ...DEFAULT_SETTINGS, ...s, notif: { ...DEFAULT_SETTINGS.notif, ...(s.notif || {}) } };
}

// Guarda en la base del artifact (privada por cuenta, separada por persona).
// Sin base (vista previa, sesión cerrada) guarda en este navegador.
const Store = {
  mode: 'starting', db: null, base: null, unsubs: [],

  async init() {
    try {
      const [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
      const id = user ? await user.id() : null;
      if (db && id) { this.db = db; this.uid = id; this.mode = 'cloud'; }
      else this.mode = 'local';
    } catch { this.mode = 'local'; }
    noteStore();
    this.open();
  },

  open() {
    this.unsubs.forEach(u => u());
    this.unsubs = [];
    COLLS.forEach(c => { state[c] = []; });
    setSettingsFrom(null);
    if (!person) { render(); return; }
    if (this.mode === 'cloud') {
      this.base = this.db.doc(`data/users/${this.uid}/${person.key}`);
      this.unsubs.push(this.base.onSnapshot(s => { setSettingsFrom(s.exists ? s.data().settings : null); soon(); }, e => this.fail(e)));
      for (const c of COLLS) {
        this.unsubs.push(this.base.collection(c).onSnapshot(snap => {
          state[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          soon();
        }, e => this.fail(e)));
      }
    } else {
      try {
        const saved = JSON.parse(lsGet('miespacio:data:' + person.key)) || {};
        COLLS.forEach(c => { state[c] = Array.isArray(saved[c]) ? saved[c] : []; });
        setSettingsFrom(saved.settings);
      } catch { }
    }
    render();
  },

  persistLocal() {
    if (this.mode !== 'cloud' && person) lsSet('miespacio:data:' + person.key, JSON.stringify(state));
  },

  // Una escritura por vez, en orden, para no saturar la base.
  queue: Promise.resolve(),
  write(fn) {
    this.queue = this.queue.then(fn).catch(e => {
      toast(e?.code === 'quota_exceeded' ? 'No hay más espacio: borrá movimientos viejos' : 'No se pudo guardar. Probá de nuevo.');
    });
  },

  put(coll, item) {
    const i = state[coll].findIndex(x => x.id === item.id);
    if (i >= 0) state[coll][i] = item; else state[coll].push(item);
    if (this.mode === 'cloud') { const { id, ...body } = item; this.write(() => this.base.collection(coll).doc(id).set(body)); }
    else this.persistLocal();
  },

  del(coll, id) {
    state[coll] = state[coll].filter(x => x.id !== id);
    if (this.mode === 'cloud') this.write(() => this.base.collection(coll).doc(id).delete());
    else this.persistLocal();
  },

  saveSettings() {
    if (this.mode === 'cloud') this.write(() => this.base.set({ settings: state.settings }));
    else this.persistLocal();
  },

  fail(e) {
    if (e?.code === 'revoked') { this.mode = 'local'; noteStore(); }
  }
};

// Varias colecciones llegan casi juntas: agrupo los renders.
let renderQueued = false;
function soon() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const typing = document.activeElement?.matches('main input, main textarea');
    if (!$('#modal').open && !typing) render(); else updateBadge();
  });
}

function noteStore() {
  $('#store-note').textContent = Store.mode === 'cloud' ? 'Guardado en tu cuenta de Claude' : Store.mode === 'local' ? 'Guardado solo en este navegador' : '';
}

const upsert = (coll, item) => Store.put(coll, { ...item, updatedAt: Date.now() });
const remove = (coll, id) => Store.del(coll, id);
function setSettings(patch) { Object.assign(state.settings, patch); Store.saveSettings(); }

// ---------- finanzas ----------
const toARS = (amount, cur) => (cur === 'USD' ? amount * (+state.settings.rate || 0) : amount);
const monthTx = mk => state.tx.filter(t => t.date?.startsWith(mk));

function totals(mk) {
  let inc = 0, exp = 0;
  for (const t of monthTx(mk)) {
    const v = toARS(+t.amount, t.currency);
    if (t.type === 'income') inc += v; else exp += v;
  }
  return { inc, exp, bal: inc - exp };
}

function byCategory(mk) {
  const m = {};
  for (const t of monthTx(mk)) if (t.type === 'expense') m[t.category] = (m[t.category] || 0) + toARS(+t.amount, t.currency);
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}

function billDue(b, mk) {
  const [y, m] = mk.split('-').map(Number);
  return `${mk}-${pad(Math.min(+b.day, new Date(y, m, 0).getDate()))}`;
}

// Pagos sin marcar de este mes (incluye vencidos) y del próximo, dentro de `days` días.
function upcomingBills(days, from = today()) {
  const lim = addDays(from, days), mk = from.slice(0, 7), out = [];
  for (const b of state.bills) {
    for (const k of [mk, shiftMonth(mk, 1)]) {
      if (b.paid?.includes(k)) continue;
      const due = billDue(b, k);
      if (due <= lim && (k === mk || due >= from)) out.push({ ...b, due, month: k });
    }
  }
  return out.sort((a, b) => a.due.localeCompare(b.due));
}

function categories(type) {
  const base = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
  const used = state.tx.filter(t => t.type === type).map(t => t.category);
  return [...new Set([...base, ...used, ...(type === 'expense' ? state.budgets.map(b => b.category) : [])])];
}

// ---------- tareas ----------
function sortTasks(list) {
  return list.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (PRIO_ORDER[a.priority] ?? 1) - (PRIO_ORDER[b.priority] ?? 1) || (a.createdAt || 0) - (b.createdAt || 0));
}

function groupTasks(list) {
  const t = today(), tm = addDays(t, 1);
  const g = { overdue: [], today: [], tomorrow: [], later: [], nodate: [], done: [] };
  for (const x of list) {
    if (x.status === 'done') g.done.push(x);
    else if (!x.due) g.nodate.push(x);
    else if (x.due < t) g.overdue.push(x);
    else if (x.due === t) g.today.push(x);
    else if (x.due === tm) g.tomorrow.push(x);
    else g.later.push(x);
  }
  for (const k in g) sortTasks(g[k]);
  g.done.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return g;
}

const pendingTasks = area => state.tasks.filter(t => t.status !== 'done' && (!area || t.area === area));

function dueLabel(due) {
  if (!due) return '';
  const d = daysBetween(today(), due);
  if (d < 0) return `<span class="tag late">Vencida · ${shortDay(due)}</span>`;
  if (d === 0) return '<span class="tag soon">Hoy</span>';
  if (d === 1) return '<span class="tag">Mañana</span>';
  return `<span class="tag">${shortDay(due)}</span>`;
}

// ---------- avisos ----------
// Lo que hoy necesita atención, según los avisos activados y sus horarios.
function alerts() {
  const s = state.settings, n = s.notif, h = new Date().getHours(), t = today(), out = [];
  const pending = pendingTasks();
  const overdue = pending.filter(x => x.due && x.due < t);
  const dueToday = pending.filter(x => x.due === t);
  const dueTom = pending.filter(x => x.due === addDays(t, 1));
  const names = l => l.slice(0, 3).map(x => x.title).join(', ') + (l.length > 3 ? ` y ${l.length - 3} más` : '');
  if (n.summary && h >= s.summaryHour) {
    const w = [...overdue, ...dueToday].filter(x => x.area === 'work').length, p = [...overdue, ...dueToday].filter(x => x.area === 'personal').length;
    const parts = [w && `${w} de laburo`, p && `${p} personal${p > 1 ? 'es' : ''}`].filter(Boolean);
    out.push({ kind: '', title: 'Resumen de hoy', body: parts.length ? `Para hoy: ${parts.join(' y ')}.` : 'Nada pendiente para hoy.' });
  }
  if (n.tasks) {
    if (overdue.length) out.push({ kind: 'late', title: `${overdue.length} tarea${overdue.length > 1 ? 's' : ''} vencida${overdue.length > 1 ? 's' : ''}`, body: names(overdue) });
    if (dueToday.length && h >= s.taskHour) out.push({ kind: 'warn', title: 'Vencen hoy y siguen pendientes', body: names(dueToday) });
    if (dueTom.length && h >= s.taskHour) out.push({ kind: '', title: 'Vencen mañana', body: names(dueTom) });
  }
  if (n.bills) {
    for (const b of upcomingBills(+s.billDaysBefore)) {
      const d = daysBetween(t, b.due);
      const when = d < 0 ? `venció hace ${-d} día${d < -1 ? 's' : ''}` : d === 0 ? 'vence hoy' : d === 1 ? 'vence mañana' : `vence en ${d} días`;
      out.push({ kind: d <= 0 ? 'late' : 'warn', title: `${b.name} ${when}`, body: `${fmt(+b.amount, b.currency)} · día ${b.day}`, bill: b });
    }
  }
  if (n.budget) {
    const spent = Object.fromEntries(byCategory(thisMonth()));
    for (const b of state.budgets) {
      const p = (spent[b.category] || 0) / b.amount * 100;
      if (p >= 80) out.push({ kind: p > 100 ? 'late' : 'warn', title: p > 100 ? `Te pasaste en ${b.category}` : `${b.category}: usaste el ${Math.round(p)}%`, body: `${fmt(spent[b.category])} de ${fmt(+b.amount)}` });
    }
  }
  if (n.evening && h >= s.eveningHour && !state.tx.some(x => x.date === t)) {
    out.push({ kind: 'warn', title: '¿Cargaste tus gastos de hoy?', body: 'Todavía no anotaste nada hoy.', evening: true });
  }
  return out;
}

            <label class="field"><span>Resumen</span>${hourSel('summaryHour', s.summaryHour)}</label>
            <label class="field"><span>Tareas</span>${hourSel('taskHour', s.taskHour)}</label>
            <label class="field"><span>Cargar gastos</span>${hourSel('eveningHour', s.eveningHour)}</label>
            <label class="field"><span>Avisar pagos</span><select id="set-billDaysBefore" data-set="billDaysBefore">${[1, 2, 3, 5, 7].map(n => `<option value="${n}" ${+s.billDaysBefore === n ? 'selected' : ''}>${n} día${n > 1 ? 's' : ''} antes</option>`).join('')}</select></label>
          </div>
        </section>
      </div>`;
  }
};

function taskView(area) {
  const all = state.tasks.filter(t => t.area === area);
  const g = groupTasks(all), f = ui.filter[area];
  const doneWeek = g.done.filter(t => (t.doneAt || 0) >= Date.now() - 7 * 864e5).length;
  const groupHtml = (key, title) => g[key].length ? `<div class="group-title">${title} <span>${g[key].length}</span></div><div class="list">${g[key].map(t => taskRow(t)).join('')}</div>` : '';
  let body = '';
  if (f !== 'done') body += [['overdue', 'Vencidas'], ['today', 'Hoy'], ['tomorrow', 'Mañana'], ['later', 'Próximas'], ['nodate', 'Sin fecha']].map(([k, t]) => groupHtml(k, t)).join('');
  if (f !== 'pending') body += groupHtml('done', 'Hechas');
  if (!body) body = `<div class="empty">${f === 'done' ? 'Todavía no completaste tareas.' : 'No hay pendientes. Escribí una arriba y apretá Enter.'}</div>`;
  return `
    <header class="page-head"><div><p class="eyebrow">${AREAS[area]} ${whoChip()}</p><h1>${area === 'work' ? '💼 Lo del laburo' : '🌱 Mis cosas'}</h1></div></header>
    ${exampleBanner()}
    <section class="cards">
      <div class="card"><div class="label">Pendientes</div><div class="value">${all.length - g.done.length}</div></div>
      <div class="card"><div class="label">Para hoy</div><div class="value">${g.today.length + g.overdue.length}</div><div class="sub">${g.overdue.length ? `${g.overdue.length} vencida${g.overdue.length > 1 ? 's' : ''}` : 'Al día'}</div></div>
      <div class="card"><div class="label">Hechas esta semana</div><div class="value pos">${doneWeek}</div></div>
    </section>
    <section class="panel">
      <form class="quick" data-quick="${area}">
        <input id="q-title-${area}" name="title" placeholder="Nueva tarea… (Enter para agregar)" autocomplete="off" required>
        <input id="q-due-${area}" name="due" type="date" title="Fecha">
        <select id="q-prio-${area}" name="priority" title="Prioridad">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${k === 'media' ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="btn primary">Agregar</button>
      </form>
      <div class="chips">${[['pending', 'Pendientes'], ['done', 'Hechas'], ['all', 'Todas']].map(([k, v]) => `<button type="button" class="chip ${f === k ? 'on' : ''}" data-action="filter" data-area="${area}" data-f="${k}">${v}</button>`).join('')}</div>
      ${body}
    </section>`;
}

// ---------- gráficos ----------
const palette = n => Array.from({ length: n }, (_, i) => css(`--c${(i % 9) + 1}`));

function chartDefaults() {
  const C = window.Chart;
  C.defaults.color = css('--muted');
  C.defaults.borderColor = css('--border');
  C.defaults.font.family = css('--font');
  C.defaults.plugins.legend.labels.boxWidth = 10;
  C.defaults.plugins.legend.labels.boxHeight = 10;
  C.defaults.maintainAspectRatio = false;
}

function noChart(id, msg) {
  const c = document.getElementById(id);
  if (c) c.parentElement.innerHTML = `<div class="empty">${msg}</div>`;
}

function catChart(mk) {
  const data = byCategory(mk);
  if (!window.Chart) return noChart('ch-cat', 'No se pudieron cargar los gráficos.');
  if (!data.length) return noChart('ch-cat', 'Sin gastos este mes.');
  charts.push(new Chart(document.getElementById('ch-cat'), {
    type: 'doughnut',
    data: { labels: data.map(d => d[0]), datasets: [{ data: data.map(d => Math.round(d[1])), backgroundColor: palette(data.length), borderColor: css('--surface'), borderWidth: 2 }] },
    options: { cutout: '62%', plugins: { legend: { position: innerWidth < 520 ? 'bottom' : 'right' }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.raw)}` } } } }
  }));
}

function monthsChart(mk) {
  if (!window.Chart) return noChart('ch-months', 'No se pudieron cargar los gráficos.');
  const months = Array.from({ length: 6 }, (_, i) => shiftMonth(mk, i - 5)), t = months.map(totals);
  charts.push(new Chart(document.getElementById('ch-months'), {
    type: 'bar',
    data: { labels: months.map(m => monthName(m, true)), datasets: [
      { label: 'Ingresos', data: t.map(x => Math.round(x.inc)), backgroundColor: css('--income'), borderRadius: 4 },
      { label: 'Gastos', data: t.map(x => Math.round(x.exp)), backgroundColor: css('--expense'), borderRadius: 4 }] },
    options: { plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.raw)}` } } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => fmt(v).replace(/\s/g, '') } }, x: { grid: { display: false } } } }
  }));
}

function doneChart() {
  if (!window.Chart) return noChart('ch-done', 'No se pudieron cargar los gráficos.');
  const start = parseDate(today());
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // lunes de esta semana
  const weeks = Array.from({ length: 8 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() - (7 - i) * 7); return d; });
  const count = area => weeks.map((w, i) => {
    const from = w.getTime(), to = i < 7 ? weeks[i + 1].getTime() : Infinity;
    return state.tasks.filter(t => t.area === area && t.status === 'done' && t.doneAt >= from && t.doneAt < to).length;
  });
  charts.push(new Chart(document.getElementById('ch-done'), {
    type: 'bar',
    data: { labels: weeks.map(w => w.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' })), datasets: [
      { label: 'Laburo', data: count('work'), backgroundColor: css('--c4'), borderRadius: 4 },
      { label: 'Personal', data: count('personal'), backgroundColor: css('--c1'), borderRadius: 4 }] },
    options: { plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
  }));
}

const AFTER = {
  inicio() { if (window.Chart) chartDefaults(); catChart(thisMonth()); doneChart(); },
  finanzas() { if (window.Chart) chartDefaults(); catChart(ui.month); monthsChart(ui.month); }
};

// ---------- modal ----------
let modalSubmit = null;

function openModal(title, body, onSubmit, extra = '', saveLabel = 'Guardar') {
  const f = $('#modal-form');
  f.innerHTML = `<header><h2>${title}</h2><button type="button" class="icon-btn" data-action="closeModal" aria-label="Cerrar">✕</button></header>
    <div class="modal-body">${body}</div>
    ${onSubmit ? `<footer>${extra}<span class="spacer"></span><button type="button" class="btn ghost" data-action="closeModal">Cancelar</button><button class="btn primary">${saveLabel}</button></footer>` : ''}`;
  modalSubmit = onSubmit;
  if (!$('#modal').open) $('#modal').showModal();
  const first = f.querySelector('.modal-body input:not([type=radio]), .modal-body textarea');
  if (first && matchMedia('(pointer: fine)').matches) first.focus();
}

function closeModal() { $('#modal').close(); modalSubmit = null; }
$('#modal').addEventListener('close', () => { modalSubmit = null; render(); });

$('#modal-form').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (modalSubmit && modalSubmit(data) !== false) closeModal();
});

const datalist = (id, items) => `<datalist id="${id}">${items.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
const currencySel = cur => `<select id="f-currency" name="currency"><option value="ARS" ${cur !== 'USD' ? 'selected' : ''}>$ ARS</option><option value="USD" ${cur === 'USD' ? 'selected' : ''}>US$ USD</option></select>`;
const delBtn = (action, id) => `<button type="button" class="btn danger ghost" data-action="confirmDelete" data-del="${action}" data-id="${id}">Eliminar</button>`;

function txForm(t) {
  const isNew = !t.id;
  t = { type: 'expense', currency: 'ARS', date: today(), ...t };
  openModal(isNew ? 'Nuevo movimiento' : 'Editar movimiento', `
    <div class="fields">
      <div class="seg">
        <input type="radio" name="type" id="ty-e" value="expense" ${t.type === 'expense' ? 'checked' : ''}><label for="ty-e">Gasto</label>
        <input type="radio" name="type" id="ty-i" value="income" ${t.type === 'income' ? 'checked' : ''}><label for="ty-i">Ingreso</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Monto</span><input id="f-amount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" required value="${esc(t.amount ?? '')}"></label>
        <label class="field"><span>Moneda</span>${currencySel(t.currency)}</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Categoría</span><input id="f-category" name="category" list="cats" required value="${esc(t.category ?? '')}" placeholder="Ej: Súper"></label>
        <label class="field"><span>Fecha</span><input id="f-date" name="date" type="date" required value="${esc(t.date)}"></label>
      </div>
      <label class="field"><span>Nota (opcional)</span><input id="f-note" name="note" value="${esc(t.note ?? '')}" placeholder="Ej: Verdulería"></label>
    </div>${datalist('cats', categories(t.type))}`,
  d => {
    upsert('tx', { ...t, ...d, amount: +d.amount, category: d.category.trim(), note: d.note.trim(), id: t.id || uid(), createdAt: t.createdAt || Date.now() });
    toast(isNew ? 'Movimiento guardado' : 'Cambios guardados');
  }, isNew ? '' : delBtn('tx', t.id));
  document.querySelectorAll('#modal input[name=type]').forEach(r => r.addEventListener('change', () => {
    $('#cats').innerHTML = categories(r.value).map(c => `<option value="${esc(c)}">`).join('');
  }));
}

function budgetForm(b = {}) {
  const isNew = !b.id;
  openModal(isNew ? 'Nuevo presupuesto' : 'Editar presupuesto', `
    <div class="fields">
      <label class="field"><span>Categoría</span><input id="f-bcat" name="category" list="bcats" required value="${esc(b.category ?? '')}" placeholder="Ej: Salidas"></label>
      <label class="field"><span>Tope mensual (en pesos)</span><input id="f-bamount" name="amount" type="number" inputmode="decimal" min="1" step="1" required value="${esc(b.amount ?? '')}"></label>
    </div>${datalist('bcats', categories('expense'))}`,
  d => { upsert('budgets', { ...b, category: d.category.trim(), amount: +d.amount, id: b.id || uid() }); toast('Presupuesto guardado'); },
  isNew ? '' : delBtn('budgets', b.id));
}

function billForm(b = {}) {
  const isNew = !b.id;
  b = { currency: 'ARS', day: 10, category: 'Servicios', paid: [], ...b };
  openModal(isNew ? 'Nuevo gasto fijo' : 'Editar gasto fijo', `
    <div class="fields">
      <label class="field"><span>Nombre</span><input id="f-name" name="name" required value="${esc(b.name ?? '')}" placeholder="Ej: Alquiler, Luz, Tarjeta"></label>
      <div class="fields two">
        <label class="field"><span>Monto</span><input id="f-famount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" required value="${esc(b.amount ?? '')}"></label>
        <label class="field"><span>Moneda</span>${currencySel(b.currency)}</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Vence el día</span><input id="f-day" name="day" type="number" min="1" max="31" required value="${esc(b.day)}"></label>
        <label class="field"><span>Categoría</span><input id="f-fcat" name="category" list="fcats" value="${esc(b.category)}"></label>
      </div>
      <p class="help" style="margin:0">Cuando lo marques como pagado se carga solo como gasto del mes.</p>
    </div>${datalist('fcats', categories('expense'))}`,
  d => { upsert('bills', { ...b, name: d.name.trim(), amount: +d.amount, currency: d.currency, day: Math.min(31, Math.max(1, +d.day)), category: d.category.trim() || 'Servicios', id: b.id || uid() }); toast('Gasto fijo guardado'); },
  isNew ? '' : delBtn('bills', b.id));
}

function taskForm(t = {}) {
  const isNew = !t.id;
  t = { area: view === 'personal' ? 'personal' : 'work', priority: 'media', status: 'todo', due: '', notes: '', ...t };
  openModal(isNew ? 'Nueva tarea' : 'Tarea', `
    <div class="fields">
      <label class="field"><span>Título</span><input id="f-title" name="title" required value="${esc(t.title ?? '')}"></label>
      <div class="seg">
        <input type="radio" name="area" id="ar-w" value="work" ${t.area === 'work' ? 'checked' : ''}><label for="ar-w">💼 Laburo</label>
        <input type="radio" name="area" id="ar-p" value="personal" ${t.area === 'personal' ? 'checked' : ''}><label for="ar-p">🌱 Personal</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Fecha</span><input id="f-due" name="due" type="date" value="${esc(t.due)}"></label>
        <label class="field"><span>Prioridad</span><select id="f-prio" name="priority">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Estado</span><select id="f-status" name="status">
        <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>Pendiente</option>
        <option value="doing" ${t.status === 'doing' ? 'selected' : ''}>En curso</option>
        <option value="done" ${t.status === 'done' ? 'selected' : ''}>Hecha</option>
      </select></label>
      <label class="field"><span>Notas</span><textarea id="f-notes" name="notes" placeholder="Detalles, links, pasos…">${esc(t.notes)}</textarea></label>
    </div>`,
  d => {
    const doneAt = d.status === 'done' ? (t.status === 'done' ? t.doneAt : Date.now()) : null;
    upsert('tasks', { ...t, ...d, title: d.title.trim(), doneAt, id: t.id || uid(), createdAt: t.createdAt || Date.now() });
    toast(isNew ? 'Tarea agregada' : 'Tarea guardada');
  }, isNew ? '' : delBtn('tasks', t.id));
}

// ---------- ejemplos ----------
function loadExamples() {
  const d = off => addDays(today(), off), id = () => uid(), ex = { example: true, updatedAt: Date.now() };
  const cats = [['Comida', 42000], ['Transporte', 18000], ['Salidas', 36000], ['Servicios', 51000], ['Súper', 64000]];
  for (let m = 0; m < 6; m++) {
    const base = shiftMonth(thisMonth(), -m) + '-0';
    upsert('tx', { ...ex, id: id(), type: 'income', amount: 900000 + (5 - m) * 30000, currency: 'ARS', category: 'Sueldo', note: 'Sueldo (ejemplo)', date: base + '1', createdAt: 1 });
    cats.forEach(([c, a], i) => upsert('tx', { ...ex, id: id(), type: 'expense', amount: Math.round(a * (0.75 + ((m + i) % 4) * 0.12)), currency: 'ARS', category: c, note: '', date: base + (2 + i), createdAt: 1 }));
  }
  upsert('tx', { ...ex, id: id(), type: 'expense', amount: 20, currency: 'USD', category: 'Suscripciones', note: 'Suscripción (ejemplo)', date: today(), createdAt: 2 });
  upsert('budgets', { ...ex, id: id(), category: 'Salidas', amount: 40000 });
  upsert('budgets', { ...ex, id: id(), category: 'Súper', amount: 70000 });
  const dom = new Date().getDate();
  upsert('bills', { ...ex, id: id(), name: 'Alquiler (ejemplo)', amount: 350000, currency: 'ARS', day: Math.min(28, dom + 2), category: 'Casa', paid: [] });
  upsert('bills', { ...ex, id: id(), name: 'Internet (ejemplo)', amount: 22000, currency: 'ARS', day: Math.max(1, dom - 5), category: 'Servicios', paid: [thisMonth()] });
  const t = (area, title, due, priority, status = 'todo', doneAt = null, notes = '') => upsert('tasks', { ...ex, id: id(), area, title, due, priority, status, doneAt, notes, createdAt: 1 });
  t('work', 'Preparar la reunión del lunes', d(-1), 'alta');
  t('work', 'Actualizar la planilla de costos', d(1), 'media', 'doing', null, 'Pedir los números del mes.');
  t('work', 'Responder mails pendientes', d(0), 'baja');
  t('personal', 'Sacar turno con la dentista', d(0), 'alta');
  t('personal', 'Comprar regalo de cumpleaños', d(4), 'media');
  t('personal', 'Ordenar el placard', '', 'baja');
  for (let i = 0; i < 12; i++) t(i % 2 ? 'work' : 'personal', `Tarea terminada ${i + 1}`, d(-i * 4), 'media', 'done', Date.now() - i * 4.5 * 864e5);
  render();
  toast('Cargué datos de ejemplo');
}

function clearExamples() {
  for (const c of COLLS) for (const x of state[c].filter(x => x.example)) remove(c, x.id);
  render();
  toast('Ejemplos borrados');
}

// ---------- acciones ----------
const find = (coll, id) => state[coll].find(x => x.id === id);

const ACTIONS = {
  go: d => go(d.view),
  closeModal,
  month: d => { ui.month = shiftMonth(ui.month, +d.d); render(); },
  filter: d => { ui.filter[d.area] = d.f; render(); },

  newTx: d => txForm({ type: d.type }),
  editTx: d => txForm({ ...find('tx', d.id) }),
  newBudget: () => budgetForm(),
  editBudget: d => budgetForm({ ...find('budgets', d.id) }),
  newBill: () => billForm(),
  editBill: d => billForm({ ...find('bills', d.id) }),
  newTask: d => taskForm({ area: d.area }),
  editTask: d => taskForm({ ...find('tasks', d.id) }),

  confirmDelete: (d, el) => {
    if (el.dataset.armed) { remove(d.del, d.id); closeModal(); toast('Eliminado'); return; }
    el.dataset.armed = '1';
    el.textContent = '¿Seguro? Tocá de nuevo';
  },

  payBill: d => {
    const b = find('bills', d.id);
    const txId = uid();
    upsert('tx', { id: txId, type: 'expense', amount: +b.amount, currency: b.currency, category: b.category || 'Servicios', note: b.name, date: d.month === thisMonth() ? today() : billDue(b, d.month), createdAt: Date.now(), billId: b.id, ...(b.example ? { example: true } : {}) });
    upsert('bills', { ...b, paid: [...new Set([...(b.paid || []), d.month])], txByMonth: { ...(b.txByMonth || {}), [d.month]: txId } });
    render();
    toast(`${b.name}: pagado`);
  },
  unpayBill: d => {
    const b = find('bills', d.id), txByMonth = { ...(b.txByMonth || {}) };
    if (txByMonth[d.month] && find('tx', txByMonth[d.month])) remove('tx', txByMonth[d.month]);
    delete txByMonth[d.month];
    upsert('bills', { ...b, paid: (b.paid || []).filter(m => m !== d.month), txByMonth });
    render();
  },
  toggleTask: d => {
    const t = find('tasks', d.id), done = t.status !== 'done';
    upsert('tasks', { ...t, status: done ? 'done' : 'todo', doneAt: done ? Date.now() : null });
    render();
    if (done) toast('¡Hecho! ✓');
  },

  editRate: () => openModal('Cotización del dólar', `<label class="field"><span>1 USD = ? ARS</span><input id="f-rate" name="rate" type="number" min="0" step="0.01" required value="${esc(state.settings.rate)}"></label>`,
    d => { setSettings({ rate: +d.rate }); toast('Cotización actualizada'); }),
  saveRate: () => { setSettings({ rate: +$('#set-rate').value || 0 }); toast('Cotización actualizada'); render(); },

  loadExamples, clearExamples,

  exportData: async () => {
    const data = JSON.stringify({ person: person.key, ...state }, null, 2);
    const dl = await window.claude?.use?.('downloads');
    if (!dl) return toast('Las descargas no están disponibles acá');
    try { const r = await dl.save({ filename: `mi-espacio-${person.key}-${today()}.json`, data }); if (r?.status === 'saved') toast('Copia descargada'); }
    catch { toast('No se descargó la copia'); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  fn(el.dataset, el);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.notif) { setSettings({ notif: { ...state.settings.notif, [el.dataset.notif]: el.checked } }); updateBadge(); return; }
  if (el.dataset.set) { setSettings({ [el.dataset.set]: +el.value }); toast('Guardado'); render(); return; }
  if (el.id === 'import-file' && el.files[0]) {
    el.files[0].text().then(txt => {
      try {
        const data = JSON.parse(txt);
        let n = 0;
        for (const c of COLLS) for (const item of (Array.isArray(data[c]) ? data[c] : [])) if (item?.id) { Store.put(c, item); n++; }
        if (data.settings) setSettings(data.settings);
        render();
        toast(`Importé ${n} elementos`);
      } catch { toast('Ese archivo no es una copia de Mi Espacio'); }
    });
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset.quick) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  if (!d.title.trim()) return;
  upsert('tasks', { id: uid(), area: f.dataset.quick, title: d.title.trim(), due: d.due, priority: d.priority, status: 'todo', notes: '', createdAt: Date.now() });
  render();
  $('form[data-quick] input[name=title]')?.focus();
});

document.querySelector('.nav').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (b) go(b.dataset.view);
});

addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (v !== view && VIEW_KEYS.includes(v)) { view = v; render(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!$('#modal').open) render(); });
new MutationObserver(() => { if (!$('#modal').open) render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
setInterval(updateBadge, 60e3);

render();
Store.init();
})();
</script>
