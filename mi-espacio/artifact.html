<title>Mi Espacio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: espacio de trabajo tipo Notion. Barra lateral fija (compu) o barra inferior + botón ＋ (celu).
   Cada página: encabezado → fila de indicadores → panel principal → paneles de apoyo → detalle.
   Escala de espacio en múltiplos de 4px; tipos: display (títulos y cifras), cuerpo, etiquetas. */
:root {
  --bg: #f3f4f0;
  --surface: #ffffff;
  --surface-2: #eaece6;
  --line: #e1e4dd;
  --text: #1c211e;
  --muted: #646b66;
  --faint: #9aa19b;
  --accent: #1d6b51;
  --accent-ink: #ffffff;
  --accent-soft: #dcece4;
  --bar: #cfd4cc;
  --income: #23855a;
  --expense: #c4553b;
  --warn: #b57a0f;
  --danger: #c23a2c;
  --work: #4f63d2;
  --work-soft: #e4e8fb;
  --late-soft: #fbe5e0;
  --warn-soft: #f9eed6;
  --doing: #7b4fa6;
  --doing-soft: #efe5f7;
  --shadow-sm: 0 1px 2px rgba(29, 52, 41, .06);
  --shadow: 0 1px 2px rgba(29, 52, 41, .05), 0 6px 20px -8px rgba(29, 52, 41, .12);
  --shadow-lg: 0 24px 60px -12px rgba(15, 30, 22, .35);
  --scrim: rgba(18, 24, 20, .4);
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r-sm: 6px; --r: 10px; --r-lg: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121513; --surface: #1a1e1b; --surface-2: #232825; --line: #2c322e;
  --text: #e7ebe7; --muted: #98a09a; --faint: #69716b;
  --accent: #5fc69b; --accent-ink: #0d1f17; --accent-soft: #1b3229; --bar: #353c37;
  --income: #63c28d; --expense: #ec8b70; --warn: #e6b04c; --danger: #f0786a;
  --work: #8d9ff0; --work-soft: #262d4a; --late-soft: #45231e; --warn-soft: #40331a; --doing: #c9a2ea; --doing-soft: #352a42;
  --shadow-sm: none; --shadow: none; --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .6); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1e1b; --surface-2: #232825; --line: #2c322e;
  --text: #e7ebe7; --muted: #98a09a; --faint: #69716b;
  --accent: #5fc69b; --accent-ink: #0d1f17; --accent-soft: #1b3229; --bar: #353c37;
  --income: #63c28d; --expense: #ec8b70; --warn: #e6b04c; --danger: #f0786a;
  --work: #8d9ff0; --work-soft: #262d4a; --late-soft: #45231e; --warn-soft: #40331a; --doing: #c9a2ea; --doing-soft: #352a42;
  --shadow-sm: none; --shadow: none; --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .6); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 650 32px/1.1 var(--font-display); letter-spacing: -.025em; }
h2 { font-size: 14px; font-weight: 650; letter-spacing: -.005em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .amount, .kpi-value { font-variant-numeric: tabular-nums; }
.pos { color: var(--income); } .neg { color: var(--expense); } .muted { color: var(--muted); }

/* ---------- estructura ---------- */
.app { display: flex; min-height: 100vh; }
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; width: 236px; flex: none;
  display: flex; flex-direction: column; gap: 2px;
  padding-block: 20px; padding-right: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  background: var(--surface-2); border-right: 1px solid var(--line);
}
.ws { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
.ws-mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 16px/1 var(--font-display); }
.ws-name { font: 650 16px/1.1 var(--font-display); letter-spacing: -.01em; }
.ws-sub { font-size: 12px; color: var(--muted); }
.nav-label { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 6px; }
.nav .tab {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: var(--r-sm);
  background: none; text-align: left; cursor: pointer; color: var(--muted); font-weight: 500;
  transition: background-color .15s ease-out, color .15s ease-out;
}
.nav .tab:hover { background: var(--line); color: var(--text); }
.nav .tab.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }
.nav .ico { width: 20px; text-align: center; font-size: 15px; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--danger); color: var(--surface); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.nav .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.nav .foot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.nav .foot.local::before { background: var(--warn); }
.nav .foot:empty { display: none; }

main { flex: 1; min-width: 0; max-width: 1200px; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.page { display: grid; gap: 20px; }

.fab { display: none; }
@media (max-width: 760px) {
  .app { display: block; }
  .nav {
    position: fixed; z-index: 10; top: auto; bottom: 0; left: 0; right: 0; width: auto; height: auto;
    flex-direction: row; justify-content: space-around; gap: 0; background: var(--surface);
    padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
    border-right: 0; border-top: 1px solid var(--line);
  }
  .ws, .nav-label, .nav .foot, .nav .count { display: none; }
  .nav .tab { position: relative; flex: 1; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; font-size: 11px; }
  .nav .tab.active { box-shadow: none; background: var(--accent-soft); color: var(--accent); }
  .nav .ico { font-size: 19px; width: auto; }
  .nav .badge { position: absolute; top: 1px; right: calc(50% - 22px); margin: 0; min-width: 17px; height: 17px; font-size: 10.5px; }
  main { padding-block: 20px calc(100px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 27px; }
  .head-actions { display: none !important; }
  .fab {
    display: grid; place-items: center; position: fixed; z-index: 11; width: 54px; height: 54px; border-radius: 16px; border: 0;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); color: var(--accent-ink); font-size: 28px; line-height: 1; cursor: pointer; box-shadow: var(--shadow-lg);
  }
}

/* ---------- encabezado ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.lede { margin-top: 8px; color: var(--muted); max-width: 60ch; }
.lede strong { color: var(--text); font-weight: 600; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background-color .15s ease-out, border-color .15s ease-out, transform .1s ease-out;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 6px 9px; border-radius: var(--r-sm); color: var(--muted); font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ---------- indicadores ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi {
  display: flex; flex-direction: column; gap: 4px; padding: 16px; min-width: 0; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
}
button.kpi { cursor: pointer; transition: border-color .15s ease-out, box-shadow .15s ease-out; }
button.kpi:hover { border-color: var(--faint); box-shadow: var(--shadow); }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.kpi-value { font: 650 26px/1.15 var(--font-display); letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-foot { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 20px; }
.kpi .spark { width: 100%; height: 30px; margin-top: 2px; color: var(--accent); }
.delta { white-space: nowrap; align-self: flex-start; font-size: 12px; font-weight: 650; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.delta.up-bad, .delta.down-bad { background: var(--late-soft); color: var(--danger); }
.delta.up-good, .delta.down-good { background: var(--accent-soft); color: var(--accent); }

/* barra de ritmo: lo gastado contra lo que va del mes */
.pace { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; }
.pace i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.pace i.warn { background: var(--warn); } .pace i.over { background: var(--danger); }
.pace b { position: absolute; top: -4px; width: 2px; height: 16px; border-radius: 2px; background: var(--text); opacity: .55; }

/* ---------- paneles ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid2 > .wide { grid-column: 1 / -1; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2, .grid-main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 20px; min-width: 0; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-title { font: 600 17px/1.3 var(--font-display); letter-spacing: -.01em; }
.panel-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.empty { color: var(--muted); font-size: 14px; padding: 20px 8px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.empty .em { font-size: 22px; }

/* ---------- gráficos dibujados con HTML ---------- */
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(84px, 120px) minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 13.5px; }
.hbar .hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .ht { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.hbar .ht i { display: block; height: 100%; border-radius: 99px; background: var(--bar); transform-origin: left; animation: grow .5s ease-out both; }
.hbar.top .ht i { background: var(--accent); }
.hbar.top .hl { font-weight: 600; }
.hbar .hv { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.hbar .hv em { font-style: normal; color: var(--faint); margin-left: 6px; display: inline-block; min-width: 3ch; }
@keyframes grow { from { transform: scaleX(0); } }

.cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; align-items: end; height: 190px; padding-top: 22px; border-bottom: 1px solid var(--line); }
.col { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%; }
.col .b { width: min(18px, 40%); border-radius: 4px 4px 1px 1px; background: var(--bar); transform-origin: bottom; animation: rise .5s ease-out both; min-height: 2px; }
.col .b.inc { background: var(--bar); }
.col .b.exp { background: var(--expense); opacity: .45; }
.col.now .b.exp { opacity: 1; }
.col .stack { width: min(26px, 60%); display: flex; flex-direction: column-reverse; border-radius: 4px 4px 1px 1px; overflow: hidden; transform-origin: bottom; animation: rise .5s ease-out both; }
.col .stack i { display: block; }
.col .tip { position: absolute; top: -20px; font-size: 11.5px; font-weight: 650; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.col-labels { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; margin-top: 6px; font-size: 11.5px; color: var(--faint); text-align: center; }
.col-labels .now { color: var(--text); font-weight: 650; }
@keyframes rise { from { transform: scaleY(0); } }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.key span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

/* ---------- listas ---------- */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: var(--r-sm); transition: background-color .12s ease-out; }
.row + .row { box-shadow: 0 -1px 0 var(--line); }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); box-shadow: none; }
.row.click:hover + .row { box-shadow: none; }
.row .main { flex: 1; min-width: 0; }
.row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row .amount { font-weight: 650; white-space: nowrap; }
.cat-ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); font-size: 16px; flex: none; }
.day-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); font-weight: 650; letter-spacing: .04em; text-transform: uppercase; margin: 18px 0 4px; }
.day-head:first-child { margin-top: 0; }

.tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.tag.work { background: var(--work-soft); color: var(--work); }
.tag.personal, .tag.ok { background: var(--accent-soft); color: var(--accent); }
.tag.late { background: var(--late-soft); color: var(--danger); }
.tag.soon { background: var(--warn-soft); color: var(--warn); }
.tag.doing { background: var(--doing-soft); color: var(--doing); }
.tag.example { background: none; border: 1px dashed var(--line); color: var(--faint); }
.prio { width: 3px; align-self: stretch; border-radius: 3px; flex: none; background: transparent; }
.prio.alta { background: var(--danger); } .prio.media { background: var(--warn); opacity: .7; }

.check {
  width: 20px; height: 20px; flex: none; border-radius: 6px; border: 1.5px solid var(--faint); background: none;
  cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; font-size: 12px; font-weight: 800;
  transition: background-color .15s ease-out, border-color .15s ease-out;
}
.check:hover { border-color: var(--accent); background: var(--accent-soft); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pop .25s ease-out; }
@keyframes pop { 50% { transform: scale(1.18); } }
.done .title { text-decoration: line-through; color: var(--faint); }

.budget { display: block; padding: 12px 8px; }
.budget .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.budget .top strong { font-weight: 600; }
.budget .note { font-size: 12px; color: var(--muted); margin-top: 6px; }

.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; }
.alert + .alert { border-top: 1px solid var(--line); }
.alert .ai { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--accent-soft); font-size: 14px; }
.alert.warn .ai { background: var(--warn-soft); } .alert.late .ai { background: var(--late-soft); }
.alert .t { font-weight: 600; }
.alert .b { color: var(--muted); font-size: 13.5px; }
.alert .main { flex: 1; min-width: 0; }

/* ---------- tareas ---------- */
.quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); margin-bottom: 14px; }
.quick:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.quick input[name=title] { flex: 1 1 220px; border: 0; background: none; box-shadow: none; }
.quick input[name=title]:focus { box-shadow: none; }
.quick input[type=date], .quick select { width: auto; background: var(--surface); }
.chips { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r); background: var(--surface-2); margin-bottom: 6px; }
.chip { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chip.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.group-title { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin: 20px 0 4px; }
.group-title.late { color: var(--danger); }

/* ---------- formularios ---------- */
input, select, textarea { width: 100%; padding: 9px 11px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
label.field > span { font-weight: 600; }
.fields { display: grid; gap: 14px; }
.fields.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 480px) { .fields.two { grid-template-columns: 1fr; } }
.big-amount { font: 650 28px/1.2 var(--font-display) !important; letter-spacing: -.02em; padding: 10px 12px !important; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: var(--r); gap: 3px; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; width: 1px; }
.seg label { text-align: center; padding: 7px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); transition: background-color .15s; }
.seg input:checked + label { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.switch + .switch { border-top: 1px solid var(--line); }
.switch input { width: 40px; height: 22px; appearance: none; background: var(--bar); border-radius: 99px; position: relative; cursor: pointer; flex: none; border: 0; padding: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s ease-out; box-shadow: var(--shadow-sm); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.switch .desc { font-size: 12.5px; color: var(--muted); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline input { width: auto; flex: 1 1 160px; }
.hours { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 14px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
(() => {
// ---------- constantes ----------
const person = { key: 'lupe', name: 'Lupe' };
const EXPENSE_CATS = ['Comida', 'Súper', 'Transporte', 'Casa', 'Servicios', 'Salud', 'Salidas', 'Ropa', 'Suscripciones', 'Educación', 'Otros'];
const INCOME_CATS = ['Sueldo', 'Freelance', 'Ventas', 'Otros'];
const CAT_ICON = { Comida: '🍝', 'Súper': '🛒', Transporte: '🚌', Casa: '🏠', Servicios: '💡', Salud: '🩺', Salidas: '🍷', Ropa: '👗', Suscripciones: '📺', 'Educación': '📚', Sueldo: '💼', Freelance: '🧾', Ventas: '🏷️' };
const AREAS = { work: 'Laburo', personal: 'Personal' };
const PRIO = { alta: 'Alta', media: 'Media', baja: 'Baja' };
const PRIO_ORDER = { alta: 0, media: 1, baja: 2 };
const COLLS = ['tx', 'budgets', 'bills', 'tasks'];
const DEFAULT_SETTINGS = { rate: 1000, notif: { summary: true, tasks: true, bills: true, evening: true, budget: true }, summaryHour: 9, taskHour: 18, eveningHour: 21, billDaysBefore: 3 };

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const thisMonth = () => today().slice(0, 7);
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysInMonth = mk => { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthName = (mk, short) => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-AR', short ? { month: 'short' } : { month: 'long', year: 'numeric' }).replace('.', ''); };
const monthOnly = mk => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-AR', { month: 'long' }); };
const prettyDay = s => cap(parseDate(s).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }));
const shortDay = s => parseDate(s).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }).replace('.', '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, cur = 'ARS') => new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur, maximumFractionDigits: cur === 'USD' ? 2 : 0 }).format(n || 0);
const fmtShort = n => '$ ' + new Intl.NumberFormat('es-AR', { notation: 'compact', maximumFractionDigits: 1 }).format(n || 0);
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { } };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

// ---------- estado ----------
const state = { tx: [], budgets: [], bills: [], tasks: [], settings: structuredClone(DEFAULT_SETTINGS) };

function setSettingsFrom(obj) {
  const s = obj || {};
  state.settings = { ...DEFAULT_SETTINGS, ...s, notif: { ...DEFAULT_SETTINGS.notif, ...(s.notif || {}) } };
}

// Guarda en la base del artifact (privada para esta cuenta).
// Sin base (vista previa, sesión cerrada) guarda en este navegador.
const Store = {
  mode: 'starting', db: null, base: null, unsubs: [],

  async init() {
    try {
      const [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
      const id = user ? await user.id() : null;
      if (db && id) { this.db = db; this.uid = id; this.mode = 'cloud'; }
      else this.mode = 'local';
    } catch { this.mode = 'local'; }
    noteStore();
    this.open();
  },

  open() {
    this.unsubs.forEach(u => u());
    this.unsubs = [];
    COLLS.forEach(c => { state[c] = []; });
    setSettingsFrom(null);
    if (this.mode === 'cloud') {
      this.base = this.db.doc(`data/users/${this.uid}/${person.key}`);
      this.unsubs.push(this.base.onSnapshot(s => { setSettingsFrom(s.exists ? s.data().settings : null); soon(); }, e => this.fail(e)));
      for (const c of COLLS) {
        this.unsubs.push(this.base.collection(c).onSnapshot(snap => {
          state[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          soon();
        }, e => this.fail(e)));
      }
    } else {
      try {
        const saved = JSON.parse(lsGet('miespacio:data:' + person.key)) || {};
        COLLS.forEach(c => { state[c] = Array.isArray(saved[c]) ? saved[c] : []; });
        setSettingsFrom(saved.settings);
      } catch { }
    }
    render();
  },

  persistLocal() {
    if (this.mode !== 'cloud') lsSet('miespacio:data:' + person.key, JSON.stringify(state));
  },

  // Una escritura por vez, en orden, para no saturar la base.
  queue: Promise.resolve(),
  write(fn) {
    this.queue = this.queue.then(fn).catch(e => {
      toast(e?.code === 'quota_exceeded' ? 'No hay más espacio: borrá movimientos viejos' : 'No se pudo guardar. Probá de nuevo.');
    });
  },

  put(coll, item) {
    const i = state[coll].findIndex(x => x.id === item.id);
    if (i >= 0) state[coll][i] = item; else state[coll].push(item);
    if (this.mode === 'cloud') { const { id, ...body } = item; this.write(() => this.base.collection(coll).doc(id).set(body)); }
    else this.persistLocal();
  },

  del(coll, id) {
    state[coll] = state[coll].filter(x => x.id !== id);
    if (this.mode === 'cloud') this.write(() => this.base.collection(coll).doc(id).delete());
    else this.persistLocal();
  },

  saveSettings() {
    if (this.mode === 'cloud') this.write(() => this.base.set({ settings: state.settings }));
    else this.persistLocal();
  },

  fail(e) {
    if (e?.code === 'revoked') { this.mode = 'local'; noteStore(); }
  }
};

// Varias colecciones llegan casi juntas: agrupo los renders.
let renderQueued = false;
function soon() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const typing = document.activeElement?.matches('main input, main textarea');
    if (!$('#modal').open && !typing) render(); else updateNav();
  });
}

function noteStore() {
  const el = $('#store-note');
  el.textContent = Store.mode === 'cloud' ? 'Guardado en tu cuenta' : Store.mode === 'local' ? 'Guardado en este navegador' : '';
  el.classList.toggle('local', Store.mode === 'local');
}

const upsert = (coll, item) => Store.put(coll, { ...item, updatedAt: Date.now() });
const remove = (coll, id) => Store.del(coll, id);
function setSettings(patch) { Object.assign(state.settings, patch); Store.saveSettings(); }

// ---------- finanzas ----------
const toARS = (amount, cur) => (cur === 'USD' ? amount * (+state.settings.rate || 0) : amount);
const monthTx = mk => state.tx.filter(t => t.date?.startsWith(mk));

function totals(mk) {
  let inc = 0, exp = 0;
  for (const t of monthTx(mk)) {
    const v = toARS(+t.amount, t.currency);
    if (t.type === 'income') inc += v; else exp += v;
  }
  return { inc, exp, bal: inc - exp };
}

function byCategory(mk) {
  const m = {};
  for (const t of monthTx(mk)) if (t.type === 'expense') m[t.category] = (m[t.category] || 0) + toARS(+t.amount, t.currency);
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}

// Qué parte del mes ya pasó (1 para meses anteriores, 0 para futuros).
function monthElapsed(mk) {
  const cur = thisMonth();
  if (mk < cur) return 1;
  if (mk > cur) return 0;
  return new Date().getDate() / daysInMonth(mk);
}

function billDue(b, mk) { return `${mk}-${pad(Math.min(+b.day, daysInMonth(mk)))}`; }

// Pagos sin marcar de este mes (incluye vencidos) y del próximo, dentro de `days` días.
function upcomingBills(days, from = today()) {
  const lim = addDays(from, days), mk = from.slice(0, 7), out = [];
  for (const b of state.bills) {
    for (const k of [mk, shiftMonth(mk, 1)]) {
      if (b.paid?.includes(k)) continue;
      const due = billDue(b, k);
      if (due <= lim && (k === mk || due >= from)) out.push({ ...b, due, month: k });
    }
  }
  return out.sort((a, b) => a.due.localeCompare(b.due));
}

function categories(type) {
  const base = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
  const used = state.tx.filter(t => t.type === type).map(t => t.category);
  return [...new Set([...base, ...used, ...(type === 'expense' ? state.budgets.map(b => b.category) : [])])];
}

const catIcon = c => CAT_ICON[c] || '•';

// ---------- tareas ----------
function sortTasks(list) {
  return list.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (PRIO_ORDER[a.priority] ?? 1) - (PRIO_ORDER[b.priority] ?? 1) || (a.createdAt || 0) - (b.createdAt || 0));
}

function groupTasks(list) {
  const t = today(), tm = addDays(t, 1);
  const g = { overdue: [], today: [], tomorrow: [], later: [], nodate: [], done: [] };
  for (const x of list) {
    if (x.status === 'done') g.done.push(x);
    else if (!x.due) g.nodate.push(x);
    else if (x.due < t) g.overdue.push(x);
    else if (x.due === t) g.today.push(x);
    else if (x.due === tm) g.tomorrow.push(x);
    else g.later.push(x);
  }
  for (const k in g) sortTasks(g[k]);
  g.done.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return g;
}

const pendingTasks = area => state.tasks.filter(t => t.status !== 'done' && (!area || t.area === area));
const dueByToday = area => pendingTasks(area).filter(t => t.due && t.due <= today());

function dueLabel(due) {
  if (!due) return '';
  const d = daysBetween(today(), due);
  if (d < 0) return `<span class="tag late">Vencida · ${shortDay(due)}</span>`;
  if (d === 0) return '<span class="tag soon">Hoy</span>';
  if (d === 1) return '<span class="tag">Mañana</span>';
  return `<span class="tag">${shortDay(due)}</span>`;
}

// ---------- avisos ----------
// Lo que hoy necesita atención, según los avisos activados y sus horarios.
function alerts() {
  const s = state.settings, n = s.notif, h = new Date().getHours(), t = today(), out = [];
  const pending = pendingTasks();
  const overdue = pending.filter(x => x.due && x.due < t);
  const dueToday = pending.filter(x => x.due === t);
  const dueTom = pending.filter(x => x.due === addDays(t, 1));
  const names = l => l.slice(0, 3).map(x => x.title).join(', ') + (l.length > 3 ? ` y ${l.length - 3} más` : '');
  if (n.summary && h >= s.summaryHour) {
    const all = [...overdue, ...dueToday];
    const w = all.filter(x => x.area === 'work').length, p = all.filter(x => x.area === 'personal').length;
    const parts = [w && `${w} de laburo`, p && `${p} personal${p > 1 ? 'es' : ''}`].filter(Boolean);
    out.push({ kind: '', icon: '☀️', title: 'Resumen de hoy', body: parts.length ? `Tenés ${parts.join(' y ')} para hoy.` : 'Nada pendiente para hoy.' });
  }
  if (n.tasks) {
    if (overdue.length) out.push({ kind: 'late', icon: '⏰', title: `${plural(overdue.length, 'tarea vencida', 'tareas vencidas')}`, body: names(overdue) });
    if (dueToday.length && h >= s.taskHour) out.push({ kind: 'warn', icon: '📌', title: 'Vencen hoy y siguen pendientes', body: names(dueToday) });
    if (dueTom.length && h >= s.taskHour) out.push({ kind: '', icon: '🗓️', title: 'Vencen mañana', body: names(dueTom) });
  }
  if (n.bills) {
    for (const b of upcomingBills(+s.billDaysBefore)) {
      const d = daysBetween(t, b.due);
      const when = d < 0 ? `venció hace ${plural(-d, 'día', 'días')}` : d === 0 ? 'vence hoy' : d === 1 ? 'vence mañana' : `vence en ${d} días`;
      out.push({ kind: d <= 0 ? 'late' : 'warn', icon: '💸', title: `${b.name} ${when}`, body: `${fmt(+b.amount, b.currency)} · día ${b.day} de cada mes`, bill: b });
    }
  }
  if (n.budget) {
    const spent = Object.fromEntries(byCategory(thisMonth()));
    for (const b of state.budgets) {
      const p = (spent[b.category] || 0) / b.amount * 100;
      if (p >= 80) out.push({ kind: p > 100 ? 'late' : 'warn', icon: '📊', title: p > 100 ? `Te pasaste en ${b.category}` : `${b.category}: usaste el ${Math.round(p)}%`, body: `${fmt(spent[b.category])} de ${fmt(+b.amount)}` });
    }
  }
  if (n.evening && h >= s.eveningHour && !state.tx.some(x => x.date === t)) {
    out.push({ kind: 'warn', icon: '✍️', title: '¿Cargaste tus gastos de hoy?', body: 'Todavía no anotaste nada hoy.', evening: true });
  }
  return out;
}

function updateNav() {
  const n = alerts().filter(a => a.kind).length;
  const b = $('#alert-badge');
  b.hidden = !n;
  b.textContent = n;
  $('#count-work').textContent = pendingTasks('work').length || '';
  $('#count-personal').textContent = pendingTasks('personal').length || '';
}

// ---------- gráficos (HTML puro, siguen el tema) ----------
function spark(values) {
  if (values.every(v => !v)) return '';
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => [i / (values.length - 1) * 100, 26 - (v - min) / span * 22]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 -2 104 32" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="0,28 ${line} 100,28" fill="currentColor" opacity=".1"></polygon>
    <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="currentColor"></circle></svg>`;
}

function catBars(mk) {
  const data = byCategory(mk);
  if (!data.length) return { title: 'Todavía no hay gastos este mes', html: '<div class="empty"><span class="em">🧾</span>Cuando cargues gastos, acá ves en qué se va la plata.</div>' };
  const total = data.reduce((s, d) => s + d[1], 0), max = data[0][1];
  const shown = data.slice(0, 6), rest = data.slice(6).reduce((s, d) => s + d[1], 0);
  if (rest) shown.push(['Otras', rest]);
  const html = `<div class="hbars">${shown.map(([c, v], i) => `<div class="hbar ${i === 0 ? 'top' : ''}">
      <span class="hl">${esc(c)}</span><span class="ht"><i style="width:${(v / max * 100).toFixed(1)}%;animation-delay:${i * 40}ms"></i></span>
      <span class="hv">${fmtShort(v)}<em>${Math.round(v / total * 100)}%</em></span></div>`).join('')}</div>`;
  return { title: `${data[0][0]} se lleva el ${Math.round(data[0][1] / total * 100)}% de tus gastos`, html };
}

function monthCols(mk) {
  const months = Array.from({ length: 6 }, (_, i) => shiftMonth(mk, i - 5));
  const t = months.map(totals);
  const max = Math.max(1, ...t.flatMap(x => [x.inc, x.exp]));
  const cur = t[5], prev = t[4];
  let title = 'Ingresos y gastos de los últimos 6 meses';
  if (cur.exp && prev.exp) {
    const d = Math.round((cur.exp / prev.exp - 1) * 100);
    title = d === 0 ? `Gastaste lo mismo que en ${monthOnly(months[4])}` : `Gastaste ${Math.abs(d)}% ${d > 0 ? 'más' : 'menos'} que en ${monthOnly(months[4])}`;
    if (mk === thisMonth()) title += ' (y el mes no terminó)';
  }
  const html = `<div class="cols" style="--n:6">${t.map((x, i) => `<div class="col ${i === 5 ? 'now' : ''}">
      ${i === 5 && x.exp ? `<span class="tip">${fmtShort(x.exp)}</span>` : ''}
      <span class="b inc" title="Ingresos ${fmt(x.inc)}" style="height:${(x.inc / max * 100).toFixed(1)}%;animation-delay:${i * 40}ms"></span>
      <span class="b exp" title="Gastos ${fmt(x.exp)}" style="height:${(x.exp / max * 100).toFixed(1)}%;animation-delay:${i * 40 + 20}ms"></span></div>`).join('')}</div>
    <div class="col-labels" style="--n:6">${months.map((m, i) => `<span class="${i === 5 ? 'now' : ''}">${monthName(m, true)}</span>`).join('')}</div>
    <div class="key"><span style="--c:var(--bar)">Ingresos</span><span style="--c:var(--expense)">Gastos</span></div>`;
  return { title, html };
}

function doneCols() {
  const start = parseDate(today());
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // lunes de esta semana
  const weeks = Array.from({ length: 8 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() - (7 - i) * 7); return d; });
  const counts = weeks.map((w, i) => {
    const from = w.getTime(), to = i < 7 ? weeks[i + 1].getTime() : Infinity;
    const done = state.tasks.filter(t => t.status === 'done' && t.doneAt >= from && t.doneAt < to);
    return { work: done.filter(t => t.area === 'work').length, personal: done.filter(t => t.area === 'personal').length };
  });
  const max = Math.max(1, ...counts.map(c => c.work + c.personal));
  const now = counts[7].work + counts[7].personal;
  const avg = counts.slice(0, 7).reduce((s, c) => s + c.work + c.personal, 0) / 7;
  const title = !state.tasks.some(t => t.status === 'done') ? 'Acá vas a ver cuántas tareas terminás por semana'
    : `${now === 1 ? 'Terminaste 1 tarea' : `Terminaste ${now} tareas`} esta semana` + (avg ? ` · tu promedio es ${avg.toFixed(1).replace('.', ',')}` : '');
  const html = `<div class="cols" style="--n:8">${counts.map((c, i) => {
      const tot = c.work + c.personal;
      return `<div class="col ${i === 7 ? 'now' : ''}">${tot && i === 7 ? `<span class="tip">${tot}</span>` : ''}
        <span class="stack" style="height:${(tot / max * 100).toFixed(1)}%;animation-delay:${i * 35}ms" title="${c.work} de laburo, ${c.personal} personales">
          <i style="height:${tot ? c.work / tot * 100 : 0}%;background:var(--work)"></i><i style="height:${tot ? c.personal / tot * 100 : 0}%;background:var(--accent)"></i></span></div>`;
    }).join('')}</div>
    <div class="col-labels" style="--n:8">${weeks.map((w, i) => `<span class="${i === 7 ? 'now' : ''}">${i === 7 ? 'Esta' : w.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }).replace('.', '')}</span>`).join('')}</div>
    <div class="key"><span style="--c:var(--work)">Laburo</span><span style="--c:var(--accent)">Personal</span></div>`;
  return { title, html };
}

// Presupuesto: lo gastado contra la parte del mes que ya pasó.
function paceInfo(mk) {
  const spent = Object.fromEntries(byCategory(mk));
  const total = state.budgets.reduce((s, b) => s + +b.amount, 0);
  const used = state.budgets.reduce((s, b) => s + (spent[b.category] || 0), 0);
  const p = total ? used / total : 0, e = monthElapsed(mk);
  const cls = p > 1 ? 'over' : p > e + 0.05 ? 'warn' : '';
  const verdict = p > 1 ? 'Te pasaste del presupuesto' : p > e + 0.05 ? 'Vas más rápido que el mes' : 'Vas bien';
  return { total, used, p, e, cls, verdict };
}

const paceBar = (p, e, cls) => `<div class="pace" title="La marca es el día de hoy"><i class="${cls}" style="width:${Math.min(p, 1) * 100}%"></i>${e > 0 && e < 1 ? `<b style="left:calc(${(e * 100).toFixed(1)}% - 1px)"></b>` : ''}</div>`;

const VIEW_KEYS = ['inicio', 'finanzas', 'laburo', 'personal', 'ajustes'];
let view = VIEW_KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'inicio';
const ui = { month: thisMonth(), filter: { work: 'pending', personal: 'pending' } };

function render() {
  document.querySelectorAll('.nav [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('#view').innerHTML = `<div class="page">${VIEWS[view]()}</div>`;
  updateNav();
}

function go(v) {
  view = v;
  try { history.replaceState(null, '', '#' + v); } catch { }
  render();
  window.scrollTo(0, 0);
}

function taskRow(t, showArea) {
  const done = t.status === 'done';
  return `<div class="row click ${done ? 'done' : ''}" data-action="editTask" data-id="${t.id}">
    <span class="prio ${esc(t.priority || 'media')}" title="Prioridad ${esc(PRIO[t.priority] || 'Media')}"></span>
    <button type="button" class="check ${done ? 'on' : ''}" data-action="toggleTask" data-id="${t.id}" aria-label="${done ? 'Marcar pendiente' : 'Marcar hecha'}">✓</button>
    <div class="main">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">
        ${showArea ? `<span class="tag ${t.area}">${AREAS[t.area]}</span>` : ''}
        ${t.status === 'doing' ? '<span class="tag doing">En curso</span>' : ''}
        ${done ? '' : dueLabel(t.due)}
        ${t.notes ? '<span title="Tiene notas">📝 Notas</span>' : ''}
        ${t.example ? '<span class="tag example">Ejemplo</span>' : ''}
      </div>
    </div>
  </div>`;
}

function exampleBanner() {
  const has = COLLS.some(c => state[c].some(x => x.example));
  const empty = COLLS.every(c => !state[c].length);
  if (has) return `<div class="banner soft"><span>Estás viendo datos de ejemplo. Borralos cuando quieras empezar con lo tuyo.</span><button type="button" class="btn sm" data-action="clearExamples">Borrar ejemplos</button></div>`;
  if (empty && Store.mode !== 'starting') return `<div class="banner"><span>Tu espacio está vacío. Cargá tu primer gasto o tarea, o mirá cómo queda con datos de ejemplo.</span><button type="button" class="btn sm" data-action="loadExamples">Ver con ejemplos</button></div>`;
  return '';
}

function taskView(area) {
  const all = state.tasks.filter(t => t.area === area);
  const g = groupTasks(all), f = ui.filter[area];
  const doneWeek = g.done.filter(t => (t.doneAt || 0) >= Date.now() - 7 * 864e5).length;
  const pending = all.length - g.done.length, forToday = g.today.length + g.overdue.length;
  const groupHtml = (key, title, cls = '') => g[key].length ? `<div class="group-title ${cls}">${title} <span>${g[key].length}</span></div><div class="list">${g[key].map(t => taskRow(t)).join('')}</div>` : '';
  let body = '';
  if (f !== 'done') body += [['overdue', 'Vencidas', 'late'], ['today', 'Hoy'], ['tomorrow', 'Mañana'], ['later', 'Próximas'], ['nodate', 'Sin fecha']].map(([k, t, c]) => groupHtml(k, t, c)).join('');
  if (f !== 'pending') body += groupHtml('done', 'Hechas');
  if (!body) body = `<div class="empty"><span class="em">${f === 'done' ? '🌤️' : '✨'}</span>${f === 'done' ? 'Todavía no completaste tareas.' : 'No hay pendientes. Escribí una arriba y apretá Enter.'}</div>`;
  const lede = pending ? `<strong>${plural(pending, 'pendiente', 'pendientes')}</strong>${forToday ? `, ${forToday} para hoy` : ''}${g.overdue.length ? ` (${plural(g.overdue.length, 'vencida', 'vencidas')})` : ''}. Esta semana terminaste ${doneWeek}.` : `Todo al día. Esta semana terminaste ${doneWeek}.`;
  return `
    <header class="page-head"><div><p class="eyebrow">${AREAS[area]}</p><h1>${area === 'work' ? 'Lo del laburo' : 'Mis cosas'}</h1><p class="lede">${lede}</p></div></header>
    ${exampleBanner()}
    <section class="panel">
      <form class="quick" data-quick="${area}">
        <input id="q-title-${area}" name="title" placeholder="＋ Nueva tarea… (Enter para agregar)" autocomplete="off" required>
        <input id="q-due-${area}" name="due" type="date" title="Fecha" aria-label="Fecha">
        <select id="q-prio-${area}" name="priority" title="Prioridad" aria-label="Prioridad">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${k === 'media' ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="btn primary sm">Agregar</button>
      </form>
      <div class="chips">${[['pending', 'Pendientes'], ['done', 'Hechas'], ['all', 'Todas']].map(([k, v]) => `<button type="button" class="chip ${f === k ? 'on' : ''}" data-action="filter" data-area="${area}" data-f="${k}">${v}</button>`).join('')}</div>
      ${body}
    </section>`;
}

// ---------- modal ----------
let modalSubmit = null;

function openModal(title, body, onSubmit, extra = '', saveLabel = 'Guardar') {
  const f = $('#modal-form');
  f.innerHTML = `<header><h2>${title}</h2><button type="button" class="icon-btn" data-action="closeModal" aria-label="Cerrar">✕</button></header>
    <div class="modal-body">${body}</div>
    ${onSubmit ? `<footer>${extra}<span class="spacer"></span><button type="button" class="btn ghost" data-action="closeModal">Cancelar</button><button class="btn primary">${saveLabel}</button></footer>` : ''}`;
  modalSubmit = onSubmit;
  if (!$('#modal').open) $('#modal').showModal();
  const first = f.querySelector('.modal-body input:not([type=radio]), .modal-body textarea');
  if (first && matchMedia('(pointer: fine)').matches) first.focus();
}

function closeModal() { $('#modal').close(); modalSubmit = null; }
$('#modal').addEventListener('close', () => { modalSubmit = null; render(); });

$('#modal-form').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (modalSubmit && modalSubmit(data) !== false) closeModal();
});

const datalist = (id, items) => `<datalist id="${id}">${items.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
const currencySel = cur => `<select id="f-currency" name="currency"><option value="ARS" ${cur !== 'USD' ? 'selected' : ''}>$ Pesos</option><option value="USD" ${cur === 'USD' ? 'selected' : ''}>US$ Dólares</option></select>`;
const delBtn = (coll, id) => `<button type="button" class="btn danger ghost" data-action="confirmDelete" data-del="${coll}" data-id="${id}">Eliminar</button>`;

function txForm(t) {
  const isNew = !t.id;
  t = { type: 'expense', currency: 'ARS', date: today(), ...t };
  openModal(isNew ? 'Nuevo movimiento' : 'Editar movimiento', `
    <div class="fields">
      <div class="seg">
        <input type="radio" name="type" id="ty-e" value="expense" ${t.type === 'expense' ? 'checked' : ''}><label for="ty-e">Gasto</label>
        <input type="radio" name="type" id="ty-i" value="income" ${t.type === 'income' ? 'checked' : ''}><label for="ty-i">Ingreso</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Monto</span><input id="f-amount" class="big-amount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0" value="${esc(t.amount ?? '')}"></label>
        <label class="field"><span>Moneda</span>${currencySel(t.currency)}</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Categoría</span><input id="f-category" name="category" list="cats" required value="${esc(t.category ?? '')}" placeholder="Ej: Súper"></label>
        <label class="field"><span>Fecha</span><input id="f-date" name="date" type="date" required value="${esc(t.date)}"></label>
      </div>
      <label class="field"><span>Nota (opcional)</span><input id="f-note" name="note" value="${esc(t.note ?? '')}" placeholder="Ej: Verdulería"></label>
    </div>${datalist('cats', categories(t.type))}`,
  d => {
    upsert('tx', { ...t, ...d, amount: +d.amount, category: d.category.trim(), note: d.note.trim(), id: t.id || uid(), createdAt: t.createdAt || Date.now() });
    toast(isNew ? 'Movimiento guardado' : 'Cambios guardados');
  }, isNew ? '' : delBtn('tx', t.id));
  document.querySelectorAll('#modal input[name=type]').forEach(r => r.addEventListener('change', () => {
    $('#cats').innerHTML = categories(r.value).map(c => `<option value="${esc(c)}">`).join('');
  }));
}

function budgetForm(b = {}) {
  const isNew = !b.id;
  openModal(isNew ? 'Nuevo presupuesto' : 'Editar presupuesto', `
    <div class="fields">
      <label class="field"><span>Categoría</span><input id="f-bcat" name="category" list="bcats" required value="${esc(b.category ?? '')}" placeholder="Ej: Salidas"></label>
      <label class="field"><span>Tope mensual en pesos</span><input id="f-bamount" class="big-amount" name="amount" type="number" inputmode="decimal" min="1" step="1" required placeholder="0" value="${esc(b.amount ?? '')}"></label>
    </div>${datalist('bcats', categories('expense'))}`,
  d => { upsert('budgets', { ...b, category: d.category.trim(), amount: +d.amount, id: b.id || uid() }); toast('Presupuesto guardado'); },
  isNew ? '' : delBtn('budgets', b.id));
}

function billForm(b = {}) {
  const isNew = !b.id;
  b = { currency: 'ARS', day: 10, category: 'Servicios', paid: [], ...b };
  openModal(isNew ? 'Nuevo gasto fijo' : 'Editar gasto fijo', `
    <div class="fields">
      <label class="field"><span>Nombre</span><input id="f-name" name="name" required value="${esc(b.name ?? '')}" placeholder="Ej: Alquiler, Luz, Tarjeta"></label>
      <div class="fields two">
        <label class="field"><span>Monto</span><input id="f-famount" class="big-amount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0" value="${esc(b.amount ?? '')}"></label>
        <label class="field"><span>Moneda</span>${currencySel(b.currency)}</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Vence el día</span><input id="f-day" name="day" type="number" min="1" max="31" required value="${esc(b.day)}"></label>
        <label class="field"><span>Categoría</span><input id="f-fcat" name="category" list="fcats" value="${esc(b.category)}"></label>
      </div>
    </div>${datalist('fcats', categories('expense'))}`,
  d => { upsert('bills', { ...b, name: d.name.trim(), amount: +d.amount, currency: d.currency, day: Math.min(31, Math.max(1, +d.day)), category: d.category.trim() || 'Servicios', id: b.id || uid() }); toast('Gasto fijo guardado'); },
  isNew ? '' : delBtn('bills', b.id));
}

function taskForm(t = {}) {
  const isNew = !t.id;
  t = { area: view === 'personal' ? 'personal' : 'work', priority: 'media', status: 'todo', due: '', notes: '', ...t };
  openModal(isNew ? 'Nueva tarea' : 'Tarea', `
    <div class="fields">
      <label class="field"><span>Título</span><input id="f-title" name="title" required value="${esc(t.title ?? '')}"></label>
      <div class="seg">
        <input type="radio" name="area" id="ar-w" value="work" ${t.area === 'work' ? 'checked' : ''}><label for="ar-w">💼 Laburo</label>
        <input type="radio" name="area" id="ar-p" value="personal" ${t.area === 'personal' ? 'checked' : ''}><label for="ar-p">🌱 Personal</label>
      </div>
      <div class="fields two">
        <label class="field"><span>Fecha</span><input id="f-due" name="due" type="date" value="${esc(t.due)}"></label>
        <label class="field"><span>Prioridad</span><select id="f-prio" name="priority">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Estado</span><select id="f-status" name="status">
        <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>Pendiente</option>
        <option value="doing" ${t.status === 'doing' ? 'selected' : ''}>En curso</option>
        <option value="done" ${t.status === 'done' ? 'selected' : ''}>Hecha</option>
      </select></label>
      <label class="field"><span>Notas</span><textarea id="f-notes" name="notes" placeholder="Detalles, links, pasos…">${esc(t.notes)}</textarea></label>
    </div>`,
  d => {
    const doneAt = d.status === 'done' ? (t.status === 'done' ? t.doneAt : Date.now()) : null;
    upsert('tasks', { ...t, ...d, title: d.title.trim(), doneAt, id: t.id || uid(), createdAt: t.createdAt || Date.now() });
    toast(isNew ? 'Tarea agregada' : 'Tarea guardada');
  }, isNew ? '' : delBtn('tasks', t.id));
}

// ---------- ejemplos ----------
function loadExamples() {
  const d = off => addDays(today(), off), id = () => uid(), ex = { example: true };
  const cats = [['Comida', 42000], ['Transporte', 18000], ['Salidas', 36000], ['Servicios', 51000], ['Súper', 64000]];
  for (let m = 0; m < 6; m++) {
    const base = shiftMonth(thisMonth(), -m) + '-0';
    upsert('tx', { ...ex, id: id(), type: 'income', amount: 900000 + (5 - m) * 30000, currency: 'ARS', category: 'Sueldo', note: 'Sueldo', date: base + '1', createdAt: 1 });
    cats.forEach(([c, a], i) => upsert('tx', { ...ex, id: id(), type: 'expense', amount: Math.round(a * (0.75 + ((m + i) % 4) * 0.12)), currency: 'ARS', category: c, note: '', date: base + (2 + i), createdAt: 1 }));
  }
  upsert('tx', { ...ex, id: id(), type: 'expense', amount: 20, currency: 'USD', category: 'Suscripciones', note: 'Suscripción de música', date: today(), createdAt: 2 });
  upsert('budgets', { ...ex, id: id(), category: 'Salidas', amount: 40000 });
  upsert('budgets', { ...ex, id: id(), category: 'Súper', amount: 70000 });
  upsert('budgets', { ...ex, id: id(), category: 'Comida', amount: 60000 });
  const dom = new Date().getDate();
  upsert('bills', { ...ex, id: id(), name: 'Alquiler', amount: 350000, currency: 'ARS', day: Math.min(28, dom + 2), category: 'Casa', paid: [] });
  upsert('bills', { ...ex, id: id(), name: 'Internet', amount: 22000, currency: 'ARS', day: Math.max(1, dom - 5), category: 'Servicios', paid: [thisMonth()] });
  const t = (area, title, due, priority, status = 'todo', doneAt = null, notes = '') => upsert('tasks', { ...ex, id: id(), area, title, due, priority, status, doneAt, notes, createdAt: 1 });
  t('work', 'Preparar la reunión del lunes', d(-1), 'alta');
  t('work', 'Actualizar la planilla de costos', d(1), 'media', 'doing', null, 'Pedir los números del mes.');
  t('work', 'Responder mails pendientes', d(0), 'baja');
  t('personal', 'Sacar turno con la dentista', d(0), 'alta');
  t('personal', 'Comprar regalo de cumpleaños', d(4), 'media');
  t('personal', 'Ordenar el placard', '', 'baja');
  for (let i = 0; i < 12; i++) t(i % 2 ? 'work' : 'personal', `Tarea terminada ${i + 1}`, d(-i * 4), 'media', 'done', Date.now() - i * 4.5 * 864e5);
  render();
  toast('Cargué datos de ejemplo');
}

function clearExamples() {
  for (const c of COLLS) for (const x of state[c].filter(x => x.example)) remove(c, x.id);
  render();
  toast('Ejemplos borrados');
}

// ---------- acciones ----------
const find = (coll, id) => state[coll].find(x => x.id === id);

const ACTIONS = {
  go: d => go(d.view),
  closeModal,
  month: d => { ui.month = shiftMonth(ui.month, +d.d); render(); },
  filter: d => { ui.filter[d.area] = d.f; render(); },
  quickAdd: () => openModal('¿Qué querés agregar?', `<div class="picker">
      <button type="button" class="pick" data-action="newTx" data-type="expense"><span>💸</span>Gasto</button>
      <button type="button" class="pick" data-action="newTx" data-type="income"><span>💰</span>Ingreso</button>
      <button type="button" class="pick" data-action="newTask" data-area="work"><span>💼</span>Tarea de laburo</button>
      <button type="button" class="pick" data-action="newTask" data-area="personal"><span>🌱</span>Tarea personal</button></div>`, null),

  newTx: d => txForm({ type: d.type }),
  editTx: d => txForm({ ...find('tx', d.id) }),
  newBudget: () => budgetForm(),
  editBudget: d => budgetForm({ ...find('budgets', d.id) }),
  newBill: () => billForm(),
  editBill: d => billForm({ ...find('bills', d.id) }),
  newTask: d => taskForm({ area: d.area }),
  editTask: d => taskForm({ ...find('tasks', d.id) }),

  confirmDelete: (d, el) => {
    if (el.dataset.armed) { remove(d.del, d.id); closeModal(); toast('Eliminado'); return; }
    el.dataset.armed = '1';
    el.textContent = '¿Seguro? Tocá de nuevo';
  },

  payBill: d => {
    const b = find('bills', d.id);
    const txId = uid();
    upsert('tx', { id: txId, type: 'expense', amount: +b.amount, currency: b.currency, category: b.category || 'Servicios', note: b.name, date: d.month === thisMonth() ? today() : billDue(b, d.month), createdAt: Date.now(), billId: b.id, ...(b.example ? { example: true } : {}) });
    upsert('bills', { ...b, paid: [...new Set([...(b.paid || []), d.month])], txByMonth: { ...(b.txByMonth || {}), [d.month]: txId } });
    render();
    toast(`${b.name}: pagado`);
  },
  unpayBill: d => {
    const b = find('bills', d.id), txByMonth = { ...(b.txByMonth || {}) };
    if (txByMonth[d.month] && find('tx', txByMonth[d.month])) remove('tx', txByMonth[d.month]);
    delete txByMonth[d.month];
    upsert('bills', { ...b, paid: (b.paid || []).filter(m => m !== d.month), txByMonth });
    render();
  },
  toggleTask: d => {
    const t = find('tasks', d.id), done = t.status !== 'done';
    upsert('tasks', { ...t, status: done ? 'done' : 'todo', doneAt: done ? Date.now() : null });
    render();
    if (done) toast('¡Hecho! ✓');
  },

  editRate: () => openModal('Cotización del dólar', `<label class="field"><span>1 dólar = ? pesos</span><input id="f-rate" class="big-amount" name="rate" type="number" min="0" step="0.01" required value="${esc(state.settings.rate)}"></label>`,
    d => { setSettings({ rate: +d.rate }); toast('Cotización actualizada'); }),
  saveRate: () => { setSettings({ rate: +$('#set-rate').value || 0 }); toast('Cotización actualizada'); render(); },

  loadExamples, clearExamples,

  exportData: async () => {
    const data = JSON.stringify({ person: person.key, ...state }, null, 2);
    const dl = await window.claude?.use?.('downloads');
    if (!dl) return toast('Las descargas no están disponibles acá');
    try { const r = await dl.save({ filename: `mi-espacio-${today()}.json`, data }); if (r?.status === 'saved') toast('Copia descargada'); }
    catch { toast('No se descargó la copia'); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  fn(el.dataset, el);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.notif) { setSettings({ notif: { ...state.settings.notif, [el.dataset.notif]: el.checked } }); updateNav(); return; }
  if (el.dataset.set) { setSettings({ [el.dataset.set]: +el.value }); toast('Guardado'); render(); return; }
  if (el.id === 'import-file' && el.files[0]) {
    el.files[0].text().then(txt => {
      try {
        const data = JSON.parse(txt);
        let n = 0;
        for (const c of COLLS) for (const item of (Array.isArray(data[c]) ? data[c] : [])) if (item?.id) { Store.put(c, item); n++; }
        if (data.settings) setSettings(data.settings);
        render();
        toast(`Importé ${n} elementos`);
      } catch { toast('Ese archivo no es una copia de Mi Espacio'); }
    });
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset.quick) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  if (!d.title.trim()) return;
  upsert('tasks', { id: uid(), area: f.dataset.quick, title: d.title.trim(), due: d.due, priority: d.priority, status: 'todo', notes: '', createdAt: Date.now() });
  render();
  $('form[data-quick] input[name=title]')?.focus();
  toast('Tarea agregada');
});

document.querySelector('.nav').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (b) go(b.dataset.view);
});

addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (v !== view && VIEW_KEYS.includes(v)) { view = v; render(); }
});
setInterval(updateNav, 60e3);

render();
Store.init();
})();
</script>
