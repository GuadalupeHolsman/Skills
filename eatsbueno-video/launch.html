  :root { --ink:#1E1E1E; --green:#3B7668; --deep:#2A5D51; --cream:#FAF0DF; --mint:#AFCFC4; --paper:#F9F4F2; --orange:#E26023; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; perspective: 1800px; }
  .abs { position: absolute; }
  .cooper { font-family: Cooper, serif; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .10; mix-blend-mode: overlay; z-index: 60; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .flower svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .wordmark { -webkit-mask: var(--wm) center / contain no-repeat; mask: var(--wm) center / contain no-repeat; background: var(--cream); aspect-ratio: 1174 / 194; }

  .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .1em; margin-bottom: -.1em; }
  .w { display: inline-block; will-change: transform; }

  .screen { position: relative; width: 430px; height: 930px; border-radius: 57px; overflow: hidden; background: #eef3ef; }
  .screen img.base { position: absolute; left: 0; top: 0; width: 430px; }

  .glare { position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.55) 48%, rgba(255,255,255,.08) 56%, transparent 64%); z-index: 85; mix-blend-mode: screen; opacity: 0; }

  .ripple { position: absolute; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 94; opacity: 0; border: 3px solid rgba(226,96,35,.9); }

  .kb .row { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
  .kb .k { width: 36px; height: 46px; border-radius: 6px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.3); display: grid; place-items: center; font: 400 21px Manrope; color: #111; position: relative; }
  .kb .k.wide { width: 50px; background: #ABB0BA; font-size: 15px; } .kb .k.space { width: 190px; font-size: 15px; } .kb .k.ret { width: 92px; background: #ABB0BA; font-size: 15px; }
  .kb .pop { position: absolute; left: 50%; bottom: 30px; width: 54px; height: 64px; margin-left: -27px; border-radius: 10px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.25); display: grid; place-items: center; font: 400 32px Manrope; opacity: 0; }

  /* scene 1 */
  .rword { position: absolute; left: 110px; top: 470px; font: 900 200px/1 Cooper; letter-spacing: -.02em; white-space: nowrap; transform-origin: 0 60%; }
  .lock { background: radial-gradient(120% 80% at 30% 0%, #2F5E53 0%, #1B3A33 50%, #0F201C 100%); }
  .lock .ltime { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font: 600 104px/1 Manrope; color: rgba(250,240,223,.92); letter-spacing: -.02em; }
  .lock .ldate { position: absolute; left: 0; right: 0; top: 66px; text-align: center; font: 600 19px Manrope; color: rgba(250,240,223,.75); }

        background: rgba(246,244,240,.9); box-shadow: 0 8px 24px rgba(0,0,0,.25); font-family: Manrope; }
  .nb .ic { width: 40px; height: 40px; border-radius: 10px; background: #e6e2da; display: grid; place-items: center; font-size: 22px; flex: none; }
  .nb .tx { flex: 1; position: relative; line-height: 1.25; }
  .nb b { font-size: 15px; color: #111; } .nb i { position: absolute; right: 0; top: 0; font-style: normal; font-size: 13px; color: #888; }
  .nb span { display: block; font-size: 15px; color: #333; }
  .card { position: absolute; width: 520px; padding: 26px 30px; border-radius: 28px; background: #fff; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45);
          display: flex; gap: 22px; align-items: center; }

  .card .t1 { font: 700 30px Cooper; color: var(--deep); line-height: 1.1; } .card .t2 { font: 600 19px Manrope; color: #6a7a75; margin-top: 6px; }
  .stat .n { font: 700 150px/0.95 Cooper; color: var(--deep); } .stat .n i { font: italic 300 70px Cooper; color: var(--orange); }
  .stat .k { font: 700 22px Manrope; letter-spacing: .2em; text-transform: uppercase; color: #6a7a75; margin-top: 10px; }
  #bg7 .wave { position: absolute; left: -1000px; width: 3840px; height: 600px; }
  .win-n { right: 0; top: 0; white-space: nowrap; font: 700 230px/1.15 Cooper; letter-spacing: -.02em; } .win-n i { font: italic 300 100px Cooper; }

    <div class="blob" style="width:900px;height:700px;left:300px;top:380px;background:radial-gradient(circle,#E27A78 0%,transparent 70%)"></div>
    <div class="abs" id="streaks" style="inset:0"></div>
    <div class="abs" id="seedsC" style="left:960px;top:330px;width:0;height:0"></div>
    <div class="abs flower" id="fl8" style="left:820px;top:190px;width:280px;height:280px;color:var(--cream)"></div>
    <div class="abs wordmark" id="wm8" style="left:610px;top:500px;width:700px"></div>
    <div class="abs cooper" id="tag8" style="left:0;right:0;top:680px;text-align:center;font-size:60px;color:var(--cream)"><i style="font-weight:300">A healthier life, your way.</i></div>
    <div class="abs" id="cta8" style="left:0;right:0;top:815px;text-align:center"><span style="display:inline-block;padding:20px 46px;border-radius:999px;border:2px solid rgba(250,240,223,.75);font:700 24px Manrope;letter-spacing:.22em;text-transform:uppercase;color:var(--cream)">No diets · No guilt · Just good</span></div>
  </section>

  <div class="abs" id="burst" style="left:960px;top:540px;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;z-index:40;visibility:hidden"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="assets/flower.js"></script>
<script src="assets/wordmark.js"></script>
<script src="assets/bands.js"></script>
<script>
(() => {
  // ================= setup =================
  gsap.registerPlugin(CustomEase);
  CustomEase.create('ebOut', '0.2, 0, 0, 1');
  CustomEase.create('ebIn', '0.4, 0, 1, 1');
  CustomEase.create('ebPush', '0.32, 0.72, 0, 1');
  CustomEase.create('ebSoft', '0.45, 0, 0.2, 1');
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'ebOut' } });
  const DUR = 48.0, BEAT = 0.5;              // 120 BPM grid
  const META = { duration: DUR, bpm: 120, slams: [], notifs: [], taps: [], keys: [], whooshes: [], hits: [], beeps: [], ticks: [], logo: [], silence: [4.65, 6.3], groove: [10.4, 40.9] };
  const $ = (s) => document.querySelector(s);
  const VB = '411 96 618 618', CX = 720, CY = 405;
  const HOLES = [[784.4,165.3],[596.1,189.9],[480.3,340.4],[504.9,528.6],[655.4,644.4],[843.6,619.9],[959.4,469.4],[934.9,281.1]];
  document.querySelectorAll('.flower').forEach(el => el.innerHTML = `<svg viewBox="${VB}"><path fill="currentColor" d="${FLOWER_D}"/></svg>`);
  document.documentElement.style.setProperty('--wm', `url(${WORDMARK_URI})`);
  const words = (el) => {   // wrap each word for per-word reveals
    const wrap = (node) => {
      if (node.nodeType === 3) {
        const frag = document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach(p => {
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
          const m = document.createElement('span'); m.className = 'wm';
          const w = document.createElement('span'); w.className = 'w'; w.textContent = p;
          m.appendChild(w); frag.appendChild(m);
        });
        node.replaceWith(frag);
      } else Array.from(node.childNodes).forEach(wrap);
    };
    Array.from(el.childNodes).forEach(wrap);
    return el.querySelectorAll('.w');
  };
  const reveal = (el, t, stagger = 0.08) => {
    const ws = words(el);
    tl.set(ws, { yPercent: 115 }, 0);
    tl.fromTo(ws, { yPercent: 115, rotation: 3 }, { yPercent: 0, rotation: 0, duration: 0.8, stagger, ease: 'ebOut', immediateRender: false }, t);
  };
  const scene = (id, t0, t1) => { tl.set('#' + id, { visibility: 'visible' }, t0); tl.set('#' + id, { visibility: 'hidden' }, t1); };

  // ---------- phone factory ----------
  const SW = 430, IH = 430 * 2532 / 1170;
  const box = (x0, y0, x1, y1) => `left:${x0 * SW}px;top:${y0 * IH}px;width:${(x1 - x0) * SW}px;height:${(y1 - y0) * IH}px;`;
  // plates come from tools/clean_plates.py: uniform 9:41, no TestFlight link, no debug pill.
  // `base` is an optional "before" plate; P.src is always the finished screen that pieces are cut from.
  const plate = (f) => `assets/screens/clean/${f}.jpg`;
  const makePhone = (parent, file, cx, cy, base = file) => {
    const ph = document.createElement('div');
    ph.className = 'phone';
    ph.style.left = (cx - 229) + 'px'; ph.style.top = (cy - 479) + 'px';
    ph.innerHTML = `<div class="screen"><div class="content" style="position:absolute;inset:0"><img class="base" src="${plate(base)}"></div><div class="island"></div><div class="glare"></div></div>`;
    parent.appendChild(ph);
    const P = { ph, scr: ph.querySelector('.screen'), content: ph.querySelector('.content'), src: plate(file), glare: ph.querySelector('.glare') };
    return P;
  };
  // layers go into the scrolling content unless `fixed` (keyboard, finger, status bar)
  function add(P, css, html = '', cls = '', fixed = false) {
    const d = document.createElement('div');
    d.className = cls; d.style.cssText = 'position:absolute;' + css; d.innerHTML = html;
    if (fixed) P.scr.insertBefore(d, P.glare); else P.content.appendChild(d);
    return d;
  }
  const patch = (P, x0, y0, x1, y1, extra = '', src = P.src) =>
    add(P, `overflow:hidden;${box(x0, y0, x1, y1)}${extra}`, `<img src="${src}" style="position:absolute;width:430px;left:${-x0 * SW}px;top:${-y0 * IH}px">`);
  const finger = (P) => { P.ripple = add(P, '', '', 'ripple', true); P.finger = add(P, '', '', 'finger', true); };
  const tap = (P, fx, fy, t) => {
    META.taps.push(t);
    const x = fx * SW, y = fy * IH;
    tl.to(P.finger, { x, duration: 0.42, ease: 'power1.inOut' }, t - 0.46);
    tl.to(P.finger, { y, duration: 0.42, ease: 'ebSoft' }, t - 0.46);
    tl.to(P.finger, { opacity: 1, duration: 0.2, ease: 'ebSoft' }, t - 0.46);
    tl.to(P.finger, { scale: 0.86, duration: 0.07, ease: 'ebIn' }, t - 0.05);
    tl.to(P.finger, { scale: 1, duration: 0.3, ease: 'ebOut' }, t + 0.03);
    tl.fromTo(P.ripple, { x, y, scale: 0.5, opacity: 0.8 }, { scale: 2.2, opacity: 0, duration: 0.5, immediateRender: false }, t);
  };
  const lift = (P, t) => tl.to(P.finger, { opacity: 0, scale: 1.15, duration: 0.3, ease: 'ebIn' }, t);
  const glareSweep = (P, t) => tl.fromTo(P.glare, { xPercent: -60, opacity: 1 }, { xPercent: 60, opacity: 1, duration: 0.9, ease: 'ebSoft', immediateRender: false }, t);
  const makeKB = (P) => {
    const kb = add(P, '', '', 'kb', true), KEY = {};
    [['qwertyuiop'], ['asdfghjkl'], ['⇧', 'zxcvbnm', '⌫'], ['123', ' ', 'return']].forEach(row => {
      const r = document.createElement('div'); r.className = 'row';
      row.forEach(part => ((part.length > 1 && !['123', 'return'].includes(part)) ? part.split('') : [part]).forEach(ch => {
        const k = document.createElement('div');
        k.className = 'k' + (ch === ' ' ? ' space' : ch === 'return' ? ' ret' : ['⇧', '⌫', '123'].includes(ch) ? ' wide' : '');
        k.textContent = ch === ' ' ? 'space' : ch;
        if (/^[a-z]$/.test(ch)) { const pop = document.createElement('div'); pop.className = 'pop'; pop.textContent = ch; k.appendChild(pop); }
        KEY[ch] = k; r.appendChild(k);
      }));
      kb.appendChild(r);
    });
    tl.set(kb, { yPercent: 100 }, 0);
    return { kb, KEY };
  };
  // human typing rhythm, deterministic
  const schedule = (text, t0, cps) => {
    const r = (i) => { const x = Math.sin(i * 12.9898 + text.length * 78.233) * 43758.5453; return x - Math.floor(x); };
    const gaps = Array.from(text, (ch, i) => (0.65 + 0.7 * r(i)) * (i > 0 && text[i - 1] === ' ' ? 1.5 : 1));
    const total = text.length / cps, sum = gaps.reduce((a, b) => a + b, 0);
    let acc = 0;
    return gaps.map(g => t0 + (acc += g * total / sum));
  };
  const typeReveal = (times, t0, render) => {
    const end = times[times.length - 1], o = { p: 0 };
    tl.fromTo(o, { p: 0 }, { p: 1, duration: end - t0 + 0.05, ease: 'none', immediateRender: false,
      onUpdate: () => { const tt = t0 + o.p * (end - t0 + 0.05); render(times.filter(x => x <= tt + 1e-6).length); } }, t0);
    tl.call(() => render(0), null, t0 - 0.01);
    times.forEach(x => META.keys.push(x));
  };
  const keyFlash = (K, text, times) => {
    for (let i = 0; i < text.length; i++) {
      const k = K.KEY[text[i].toLowerCase()]; if (!k) continue;
      tl.fromTo(k, { backgroundColor: '#B9BEC6' }, { backgroundColor: '#ffffff', duration: 0.18, immediateRender: false }, times[i]);
      const pop = k.querySelector('.pop');
      if (pop) tl.fromTo(pop, { opacity: 1 }, { opacity: 0, duration: 0.14, delay: 0.06, immediateRender: false }, times[i]);
    }
  };
  const seedRing = (box, size) => HOLES.map(([x, y]) => {
    const s = document.createElement('div'); s.className = 'seed';
    const k = size / 618, d = 72 * k;
    s.style.cssText = `width:${d}px;height:${d}px;left:${(x - CX) * k - d / 2}px;top:${(y - CY) * k - d / 2}px`;
    box.appendChild(s); return s;
  });
  const burst = (color, t) => {
    tl.set('#burst', { visibility: 'visible', background: color, scale: 0, opacity: 1 }, t);
    tl.to('#burst', { scale: 230, duration: 0.6, ease: 'power2.in' }, t);
    tl.to('#burst', { opacity: 0, duration: 0.45, ease: 'ebSoft' }, t + 0.62);
    tl.set('#burst', { visibility: 'hidden' }, t + 1.1);
    META.whooshes.push(t + 0.55);
  };

  // ================= 1 · Diet noise (0 – 6.5) =================
  // a locked phone drowning in diet-app pings while the rules hammer in on the beat;
  // then silence, the notifications clear, and the brand flower opens over everything
  scene('sc1', 0, 6.55);
  const chaos = $('#chaos');
  const L = document.createElement('div');
  L.className = 'phone'; L.style.left = (1340 - 229) + 'px'; L.style.top = (560 - 479) + 'px';
  L.innerHTML = `<div class="screen lock"><div class="ltime">9:41</div><div class="ldate">Wednesday, October 7</div><div class="lstack"></div><div class="island"></div></div>`;
  chaos.appendChild(L);
  tl.fromTo(L, { scale: 0.8, rotationY: -22, rotationX: 6 }, { scale: 0.9, rotationY: -8, rotationX: 0, duration: 4.6, ease: 'ebSoft', immediateRender: true }, 0);
  tl.fromTo(chaos, { scale: 1 }, { scale: 1.05, duration: 4.6, ease: 'none', immediateRender: true }, 0);   // slow push-in, tension
  const NOTIFS = [
    ['⚖️', 'Calorie Tracker', "You're 340 kcal over today."], ['🥑', 'KetoLife', "Day 3. Don't you dare quit."],
    ['⏰', 'Reminder', 'Weigh yourself. Again.'], ['📉', 'FitGoal', 'Goal failed ✖'],
    ['⏳', 'Fasting Timer', '14 h left. Stay strong.'], ['⚖️', 'Calorie Tracker', 'That cookie was 230 kcal.'],
    ['📈', 'Scale+', '+0.4 kg since yesterday.'], ['🥗', 'DietCoach', 'Cheat day = setback.'], ['🍗', 'Macro Counter', 'Protein target missed.'],
  ];
  const notifT = [0.85, 1.6, 2.2, 2.7, 3.1, 3.4, 3.7, 3.95, 4.2];
  const stack = L.querySelector('.lstack'), NB = [];
  NOTIFS.forEach(([ic, app, msg], k) => {
    const n = document.createElement('div'); n.className = 'nb';
    n.innerHTML = `<div class="ic">${ic}</div><div class="tx"><b>${app}</b><i>now</i><span>${msg}</span></div>`;
    stack.appendChild(n); NB.push(n);
    const t = notifT[k];
    tl.fromTo(n, { y: -34, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.32, ease: 'ebOut', immediateRender: true }, t);
    NB.slice(0, k).forEach((p, j) => tl.fromTo(p, { y: (k - 1 - j) * 82 }, { y: (k - j) * 82, duration: 0.3, ease: 'ebOut', immediateRender: false }, t));
    tl.fromTo(L, { rotationZ: 0 }, { keyframes: [{ rotationZ: 1.4 }, { rotationZ: -1.4 }, { rotationZ: 1 }, { rotationZ: 0 }], duration: 0.2, ease: 'none', immediateRender: false }, t);   // buzz
    META.notifs.push(t);
  });
  // the rules, one huge word per beat, faster and faster
  const WORDS = [['COUNT.', '#FAF0DF'], ['CUT.', '#F0A26A'], ['SKIP.', '#AFCFC4'], ['BURN.', '#E26023'], ['WEIGH.', '#FAF0DF'], ['RESTRICT.', '#F0A26A'], ['REPEAT.', '#E26023']];
  const wordT = [0.5, 1.5, 2.25, 2.75, 3.25, 3.65, 4.05];
  const WEL = WORDS.map(([w, c], i) => {
    const el = document.createElement('div'); el.className = 'rword'; el.textContent = w; el.style.color = c;
    el.style.fontSize = Math.min(210, 940 / (w.length * 0.72)) + 'px'; el.style.marginTop = -Math.min(210, 940 / (w.length * 0.72)) / 2 + 'px';
    chaos.insertBefore(el, L);
    tl.fromTo(el, { opacity: 0, scale: 1.35, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power3.out', immediateRender: true }, wordT[i]);
    if (i < WORDS.length - 1) tl.set(el, { opacity: 0 }, wordT[i + 1]);
    META.slams.push(wordT[i]);
    return el;
  });
  // freeze → silence: the last word dissolves, the notifications are swiped away, the phone backs off
  tl.to(WEL[WEL.length - 1], { opacity: 0, filter: 'blur(16px)', duration: 0.5, ease: 'ebSoft' }, 4.65);
  tl.to(NB.slice().reverse(), { x: 420, opacity: 0, duration: 0.4, stagger: 0.035, ease: 'ebIn' }, 4.7);
  tl.to(L, { x: 960 - 1340, y: 30, scale: 0.62, rotationY: 0, opacity: 0.32, filter: 'blur(5px)', duration: 1.0, ease: 'ebSoft' }, 4.75);
  tl.set('#exhaust', { opacity: 1 }, 4.95);
  reveal($('#exhaust'), 4.95, 0.12);
  tl.to('#exhaust', { scale: 0.6, opacity: 0, filter: 'blur(10px)', duration: 0.45, ease: 'ebIn' }, 5.75);
  tl.to(L, { scale: 0.3, opacity: 0, duration: 0.45, ease: 'ebIn' }, 5.75);
  // the flower opens: eight petals grow out of the centre and flood the frame with brand orange
  const petals = $('#petals');
  const PC = ['#F0A26A', '#E9876A', '#E26023', '#F2B07E'];
  HOLES.forEach(([hx, hy], i) => {
    const d = document.createElement('div'), k = 360 / 618;
    d.style.cssText = `position:absolute;left:${(hx - CX) * k - 40}px;top:${(hy - CY) * k - 40}px;width:80px;height:80px;border-radius:50%;background:${PC[i % 4]}`;
    petals.appendChild(d);
    tl.fromTo(d, { scale: 0 }, { scale: 32, duration: 0.7, ease: 'ebIn', immediateRender: true }, 5.85 + i * 0.03);
  });
  const core = document.createElement('div');
  core.style.cssText = 'position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;background:#E26023';
  petals.appendChild(core);
  tl.fromTo(core, { scale: 0 }, { scale: 24, duration: 0.5, ease: 'ebIn', immediateRender: true }, 6.05);
  tl.fromTo(petals, { rotation: -30 }, { rotation: 20, duration: 0.8, ease: 'ebSoft', immediateRender: true }, 5.85);
  META.whooshes.push(6.3); META.hits.push(6.5);

  // ================= 2 · The turn (6.5 – 10.5) =================
  scene('sc2', 6.5, 10.95);
  const seedsB = seedRing($('#seedsB'), 360);
  tl.set(seedsB, { opacity: 1 }, 6.5);
  tl.fromTo('#fl2', { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 1.2, ease: 'ebOut', immediateRender: true }, 6.6);
  tl.to(seedsB, { scale: 0, duration: 0.4, ease: 'ebIn' }, 6.75);
  META.logo.push(6.6);
  tl.to('#fl2', { y: -250, scale: 0.42, duration: 0.9, ease: 'ebSoft' }, 7.6);
  tl.set(['#t2b', '#wm2'], { opacity: 0 }, 0);
  reveal($('#t2a'), 7.95, 0.1);
  tl.fromTo('#t2a .sline', { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'ebPush', immediateRender: false }, 8.5);   // crossed out
  META.whooshes.push(8.55);
  tl.set('#t2a', { opacity: 0 }, 8.95); tl.set('#t2b', { opacity: 1 }, 8.95);          // hard word-swap on the beat
  reveal($('#t2b'), 8.95, 0.09);
  META.hits.push(8.95);
  tl.set('#t2b', { opacity: 0 }, 9.95);
  tl.fromTo('#wm2', { opacity: 1, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: 0.6, ease: 'ebOut', immediateRender: false }, 9.95);
  META.hits.push(9.95);
  // zoom-through into the hero
  tl.set('#sc2', { zIndex: 5 }, 10.44);
  tl.to('#sc2', { scale: 1.35, filter: 'blur(14px)', opacity: 0, duration: 0.5, ease: 'ebIn' }, 10.45);
  META.whooshes.push(10.45);

  // ================= 3 · Phone hero (10.5 – 14.4) =================
  scene('sc3', 10.45, 14.45);
  tl.fromTo('#sc3', { scale: 1.12, filter: 'blur(12px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.8, ease: 'ebOut', immediateRender: false }, 10.55);
  const P3 = makePhone($('#ph3wrap'), 'Welcome', 960, 680);
  gsap.set(P3.ph, { scale: 0.8 });
  finger(P3);
  tl.fromTo(P3.ph, { x: 380, y: 520, z: -1800, rotationY: 78, rotationX: 28, rotationZ: -14, opacity: 0 },
    { x: 0, y: 0, z: 0, rotationY: 0, rotationX: 0, rotationZ: 0, scale: 0.8, opacity: 1, duration: 1.35, ease: 'ebOut', immediateRender: true }, 10.6);
  META.whooshes.push(10.75);
  glareSweep(P3, 11.75);
  tl.set('#meet', { opacity: 1 }, 0);
  reveal($('#meet'), 11.55, 0.12);
  tl.fromTo('#sub3', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, immediateRender: true }, 12.2);
  tap(P3, 0.5, 0.815, 13.25);
  lift(P3, 13.4);
  // the screen itself advances to onboarding step 1 (in-app push) …
  const step1In = add(P3, 'inset:0;z-index:6;box-shadow:-30px 0 60px rgba(0,0,0,.25)',
    `<img src="${plate('Onboarding_Step1')}" style="position:absolute;width:430px;left:0;top:0">`);
  tl.fromTo(step1In, { xPercent: 100 }, { xPercent: 0, duration: 0.6, ease: 'ebPush', immediateRender: true }, 13.4);
  tl.to('#meet, #sub3', { opacity: 0, y: -40, duration: 0.4, ease: 'ebIn' }, 13.5);
  META.whooshes.push(13.45);

  // ================= 4 · Built around you (14.4 – 20.6) =================
  scene('sc4', 13.95, 21.2);
  tl.fromTo('#sc4', { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'ebSoft', immediateRender: false }, 13.95);   // only the background changes
  const W4 = $('#world4');
  const P4a = makePhone(W4, 'Onboarding_Step1', 960, 650);
  const P4b = makePhone(W4, 'Onboarding_Step2', 1560, 650);
  const P4c = makePhone(W4, 'Onboarding_Step7', 2160, 650, 'Onboarding_Step7_Empty');
  [P4a, P4b, P4c].forEach((P, i) => gsap.set(P.ph, { scale: 0.86, z: i === 0 ? 0 : -220, rotationY: i === 0 ? 0 : -14 }));
  // world starts matched to the hero phone (center 960,680 · scale .8), then opens up
  tl.fromTo(W4, { scale: 0.8 / 0.86, y: 30, transformOrigin: '960px 650px' }, { scale: 1, y: 0, duration: 0.9, ease: 'ebSoft', immediateRender: true }, 14.35);
  tl.fromTo([P4b.ph, P4c.ph], { x: 700 }, { x: 0, duration: 0.9, stagger: 0.08, ease: 'ebOut', immediateRender: true }, 14.35);
  finger(P4a); finger(P4c);
  reveal($('#h4'), 14.6, 0.1);
  // goal pick
  const goalHl = add(P4a, `left:41%;top:75.5%;width:18%;height:8.4%;border:3px solid #E26023;border-radius:16px;background:rgba(226,96,35,.08);opacity:0`);
  tap(P4a, 0.505, 0.795, 15.3);
  tl.fromTo(goalHl, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.35, immediateRender: false }, 15.3);
  lift(P4a, 15.45);
  // camera travels phone → phone (world moves; the focused phone turns to face us)
  const travel = (t, x, focus, prev) => {
    tl.to(W4, { x, duration: 1.0, ease: 'ebSoft' }, t);
    tl.to(focus.ph, { z: 0, rotationY: 0, duration: 1.0, ease: 'ebSoft' }, t);
    tl.to(prev.ph, { z: -220, rotationY: 14, duration: 1.0, ease: 'ebSoft' }, t);
    META.whooshes.push(t + 0.2);
  };
  travel(15.9, -600, P4b, P4a);
  travel(17.15, -1200, P4c, P4b);
  // name: field → keyboard → "Srushti"
  const greet = [patch(P4c, 0.08, 0.553, 0.92, 0.586), patch(P4c, 0.08, 0.704, 0.92, 0.734)];
  tl.set(greet, { opacity: 0 }, 0);
  const sbar7 = patch(P4c, 0, 0, 1, 0.056, 'z-index:70', P4c.src);   // status bar stays put while content scrolls
  P4c.scr.insertBefore(sbar7, P4c.glare);
  const avatarS = patch(P4c, 0.4, 0.4094, 0.6, 0.5018, 'border-radius:50%');
  const nameP = patch(P4c, 0.3, 0.598, 0.705, 0.652);
  const caret = add(P4c, `top:${0.603 * IH}px;height:${0.044 * IH}px;width:2.5px;background:#3B7668;opacity:0;left:${0.5 * SW}px`);
  const K4 = makeKB(P4c);
  tl.set([avatarS, nameP], { opacity: 0 }, 0);
  tap(P4c, 0.5, 0.625, 17.95);
  tl.fromTo(K4.kb, { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: 'ebPush', immediateRender: false }, 18.05);
  tl.fromTo(P4c.content, { y: 0 }, { y: -110, duration: 0.45, ease: 'ebPush', immediateRender: false }, 18.05);   // keep the field above the keyboard
