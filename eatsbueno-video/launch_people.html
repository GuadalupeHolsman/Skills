<script>
(() => {
  // ================= setup =================
  gsap.registerPlugin(CustomEase);

  CustomEase.create('ebIn', '0.4, 0, 1, 1');
  CustomEase.create('ebPush', '0.32, 0.72, 0, 1');
  CustomEase.create('ebSoft', '0.45, 0, 0.2, 1');
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'ebOut' } });
  let DUR = 48.0; const BEAT = 0.5;              // 120 BPM grid
  const META = { duration: DUR, bpm: 120, slams: [], notifs: [], taps: [], keys: [], whooshes: [], hits: [], beeps: [], ticks: [], logo: [], scans: [], success: [], pops: [], silence: [4.65, 6.3], groove: [10.4, 40.9] };
  const $ = (s) => document.querySelector(s);
  const VB = '411 96 618 618', CX = 720, CY = 405;
  const HOLES = [[784.4,165.3],[596.1,189.9],[480.3,340.4],[504.9,528.6],[655.4,644.4],[843.6,619.9],[959.4,469.4],[934.9,281.1]];
  document.querySelectorAll('.flower').forEach(el => el.innerHTML = `<svg viewBox="${VB}"><path fill="currentColor" d="${FLOWER_D}"/></svg>`);
  document.documentElement.style.setProperty('--wm', `url(${WORDMARK_URI})`);
  const words = (el) => {   // wrap each word for per-word reveals
    const wrap = (node) => {
      if (node.nodeType === 3) {
        const frag = document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach(p => {
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
          const m = document.createElement('span'); m.className = 'wm';
          const w = document.createElement('span'); w.className = 'w'; w.textContent = p;
          m.appendChild(w); frag.appendChild(m);
        });
        node.replaceWith(frag);
      } else Array.from(node.childNodes).forEach(wrap);
    };
    Array.from(el.childNodes).forEach(wrap);
    return el.querySelectorAll('.w');
  };
  const reveal = (el, t, stagger = 0.08) => {
    const ws = words(el);
    tl.set(ws, { yPercent: 115 }, 0);
    tl.fromTo(ws, { yPercent: 115, rotation: 3 }, { yPercent: 0, rotation: 0, duration: 0.8, stagger, ease: 'ebOut', immediateRender: false }, t);
  };
  const scene = (id, t0, t1) => { tl.set('#' + id, { visibility: 'visible' }, t0); tl.set('#' + id, { visibility: 'hidden' }, t1); };

  // ---------- phone factory ----------
  const SW = 430, IH = 430 * 2532 / 1170;
  const box = (x0, y0, x1, y1) => `left:${x0 * SW}px;top:${y0 * IH}px;width:${(x1 - x0) * SW}px;height:${(y1 - y0) * IH}px;`;
  // plates come from tools/clean_plates.py: uniform 9:41, no TestFlight link, no debug pill.
  // `base` is an optional "before" plate; P.src is always the finished screen that pieces are cut from.
  const plate = (f) => `assets/screens/clean/${f}.jpg`;
  const makePhone = (parent, file, cx, cy, base = file) => {
    const ph = document.createElement('div');
    ph.className = 'phone';
    ph.style.left = (cx - 229) + 'px'; ph.style.top = (cy - 479) + 'px';
    ph.innerHTML = `<div class="screen"><div class="content" style="position:absolute;inset:0"><img class="base" src="${plate(base)}"></div><div class="island"></div><div class="glare"></div></div>`;
    parent.appendChild(ph);
    const P = { ph, scr: ph.querySelector('.screen'), content: ph.querySelector('.content'), src: plate(file), glare: ph.querySelector('.glare') };
    return P;
  };
  // layers go into the scrolling content unless `fixed` (keyboard, finger, status bar)
  function add(P, css, html = '', cls = '', fixed = false) {
    const d = document.createElement('div');
    d.className = cls; d.style.cssText = 'position:absolute;' + css; d.innerHTML = html;
    if (fixed) P.scr.insertBefore(d, P.glare); else P.content.appendChild(d);
    return d;
  }
  const uiHTML = (file, xf, yf, wpx, css = '') =>
    `<div style="position:absolute;left:${xf * SW}px;top:${yf * IH}px;width:${wpx / 786 * SW}px;${css}"><img src="assets/ui/${file}.png" style="display:block;width:100%"></div>`;
  const uiImg = (parent, file, xf, yf, wpx, css = '') => { parent.insertAdjacentHTML('beforeend', uiHTML(file, xf, yf, wpx, css)); return parent.lastElementChild; };
  const patch = (P, x0, y0, x1, y1, extra = '', src = P.src) =>
    add(P, `overflow:hidden;${box(x0, y0, x1, y1)}${extra}`, `<img src="${src}" style="position:absolute;width:430px;left:${-x0 * SW}px;top:${-y0 * IH}px">`);
  const finger = (P) => { P.ripple = add(P, '', '', 'ripple', true); P.finger = add(P, '', '', 'finger', true); };
  const tap = (P, fx, fy, t) => {
    META.taps.push(t);
    const x = fx * SW, y = fy * IH;
    tl.to(P.finger, { x, duration: 0.42, ease: 'power1.inOut' }, t - 0.46);
    tl.to(P.finger, { y, duration: 0.42, ease: 'ebSoft' }, t - 0.46);
    tl.to(P.finger, { opacity: 1, duration: 0.2, ease: 'ebSoft' }, t - 0.46);
    tl.to(P.finger, { scale: 0.86, duration: 0.07, ease: 'ebIn' }, t - 0.05);
    tl.to(P.finger, { scale: 1, duration: 0.3, ease: 'ebOut' }, t + 0.03);
    tl.fromTo(P.ripple, { x, y, scale: 0.5, opacity: 0.8 }, { scale: 2.2, opacity: 0, duration: 0.5, immediateRender: false }, t);
  };
  const lift = (P, t) => tl.to(P.finger, { opacity: 0, scale: 1.15, duration: 0.3, ease: 'ebIn' }, t);
  const glareSweep = (P, t) => tl.fromTo(P.glare, { xPercent: -60, opacity: 1 }, { xPercent: 60, opacity: 1, duration: 0.9, ease: 'ebSoft', immediateRender: false }, t);
  const makeKB = (P) => {
    const kb = add(P, '', '', 'kb', true), KEY = {};
    [['qwertyuiop'], ['asdfghjkl'], ['⇧', 'zxcvbnm', '⌫'], ['123', ' ', 'return']].forEach(row => {
      const r = document.createElement('div'); r.className = 'row';
      row.forEach(part => ((part.length > 1 && !['123', 'return'].includes(part)) ? part.split('') : [part]).forEach(ch => {
        const k = document.createElement('div');
        k.className = 'k' + (ch === ' ' ? ' space' : ch === 'return' ? ' ret' : ['⇧', '⌫', '123'].includes(ch) ? ' wide' : '');
        k.textContent = ch === ' ' ? 'space' : ch;
        if (/^[a-z]$/.test(ch)) { const pop = document.createElement('div'); pop.className = 'pop'; pop.textContent = ch; k.appendChild(pop); }
        KEY[ch] = k; r.appendChild(k);
      }));
      kb.appendChild(r);
    });
    tl.set(kb, { yPercent: 100 }, 0);
    return { kb, KEY };
  };
  // human typing rhythm, deterministic
  const schedule = (text, t0, cps) => {
    const r = (i) => { const x = Math.sin(i * 12.9898 + text.length * 78.233) * 43758.5453; return x - Math.floor(x); };
    const gaps = Array.from(text, (ch, i) => (0.65 + 0.7 * r(i)) * (i > 0 && text[i - 1] === ' ' ? 1.5 : 1));
    const total = text.length / cps, sum = gaps.reduce((a, b) => a + b, 0);
    let acc = 0;
    return gaps.map(g => t0 + (acc += g * total / sum));
  };
  const typeReveal = (times, t0, render) => {
    const end = times[times.length - 1], o = { p: 0 };
    tl.fromTo(o, { p: 0 }, { p: 1, duration: end - t0 + 0.05, ease: 'none', immediateRender: false,
      onUpdate: () => { const tt = t0 + o.p * (end - t0 + 0.05); render(times.filter(x => x <= tt + 1e-6).length); } }, t0);
    tl.call(() => render(0), null, t0 - 0.01);
    times.forEach(x => META.keys.push(x));
  };
  const keyFlash = (K, text, times) => {
    for (let i = 0; i < text.length; i++) {
      const k = K.KEY[text[i].toLowerCase()]; if (!k) continue;
      tl.fromTo(k, { backgroundColor: '#B9BEC6' }, { backgroundColor: '#ffffff', duration: 0.18, immediateRender: false }, times[i]);
      const pop = k.querySelector('.pop');
      if (pop) tl.fromTo(pop, { opacity: 1 }, { opacity: 0, duration: 0.14, delay: 0.06, immediateRender: false }, times[i]);
    }
  };
  const seedRing = (box, size) => HOLES.map(([x, y]) => {
    const s = document.createElement('div'); s.className = 'seed';
    const k = size / 618, d = 72 * k;
    s.style.cssText = `width:${d}px;height:${d}px;left:${(x - CX) * k - d / 2}px;top:${(y - CY) * k - d / 2}px`;
    box.appendChild(s); return s;
  });
  const burst = (color, t) => {
    tl.set('#burst', { visibility: 'visible', background: color, scale: 0, opacity: 1 }, t);
    tl.to('#burst', { scale: 230, duration: 0.6, ease: 'power2.in' }, t);
    tl.to('#burst', { opacity: 0, duration: 0.45, ease: 'ebSoft' }, t + 0.62);
    tl.set('#burst', { visibility: 'hidden' }, t + 1.1);
    META.whooshes.push(t + 0.55);
  };

  // ================= 1 · Diet noise (0 – 8.0) =================
  // no phone: real people living under the rules — the rule words hit on the beat, diet numbers swarm
  // around them; then silence, one human line held long enough to land, and the brand flower opens
  const buildSc1 = () => {
    scene('sc1', 0, 8.55);
    const S1 = $('#sc1'), chaos = $('#chaos');
    const DARK = 'background:radial-gradient(120% 110% at 50% 45%,rgba(16,13,11,.45) 0%,rgba(16,13,11,.78) 70%,rgba(16,13,11,.9) 100%)';
    const f1 = [foot(S1, chaos, 'counting', 0, 2.3, { tint: DARK, vcss: 'filter:saturate(.6) contrast(1.05)' }),
                foot(S1, chaos, 'choice', 2.25, 1.05, { inPt: 0.3, tint: DARK, vcss: 'filter:saturate(.6) contrast(1.05)' }),
                foot(S1, chaos, 'tired', 3.25, 5.1, { tint: DARK, vcss: 'filter:saturate(.6) contrast(1.05)' })];
    show(f1[0], 0, 2.25, 0.5); show(f1[1], 2.25, 3.25); show(f1[2], 3.25, 8.25);
    tl.fromTo([f1[0].firstChild, f1[1].firstChild], { scale: 1.0 }, { scale: 1.08, duration: 3.3, ease: 'none', immediateRender: false }, 0);
    tl.fromTo(f1[2].firstChild, { scale: 1.04 }, { scale: 1.2, duration: 5.0, ease: 'none', immediateRender: false }, 3.25);   // one slow push into her
    // the rules, one huge word per beat
    const WORDS = [['COUNT.', '#FAF0DF'], ['CUT.', '#F0A26A'], ['SKIP.', '#AFCFC4'], ['BURN.', '#E26023'], ['WEIGH.', '#FAF0DF'], ['RESTRICT.', '#F0A26A'], ['REPEAT.', '#E26023']];
    const wordT = [0.5, 1.5, 2.25, 2.75, 3.25, 3.65, 4.05];
    const WEL = WORDS.map(([w, c], i) => {
      const el = document.createElement('div'); el.className = 'rword'; el.textContent = w; el.style.color = c;
      el.style.cssText += ';left:0;right:0;text-align:center;transform-origin:50% 60%';
      const fs = Math.min(230, 1500 / (w.length * 0.72)); el.style.fontSize = fs + 'px'; el.style.marginTop = -fs / 2 + 'px';
      chaos.appendChild(el);
      tl.fromTo(el, { opacity: 0, scale: 1.35, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power3.out', immediateRender: true }, wordT[i]);
      if (i < WORDS.length - 1) tl.set(el, { opacity: 0 }, wordT[i + 1]);
      META.slams.push(wordT[i]);
      return el;
    });
    // the numbers that run their day
    const PILLS = [['−340 kcal', 150, 210], ['1,200 kcal max', 1330, 170], ['0 g carbs', 220, 820], ['14 h fasting', 1420, 760],
                   ['+0.4 kg', 760, 140], ['cheat day ✖', 1080, 900], ['macros 31 / 40 / 29', 380, 640], ['2,000 steps left', 1300, 620]];
    const pillT = [0.85, 1.6, 2.2, 2.7, 3.1, 3.4, 3.7, 3.95];
    const pills = PILLS.map(([txt, x, y], i) => {
      const p = document.createElement('div'); p.className = 'dpill'; p.textContent = txt;
      p.style.left = x + 'px'; p.style.top = y + 'px';
      chaos.appendChild(p);
      tl.fromTo(p, { opacity: 0, scale: 0.8, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: 'ebOut', immediateRender: true }, pillT[i]);
      tl.to(p, { y: -26, duration: 4.65 - pillT[i], ease: 'none' }, pillT[i] + 0.3);
      META.pops.push(pillT[i]);
      return p;
    });

      if (Math.abs(v.currentTime - want) < 1e-3 && v.readyState >= 2) return res();
      v.addEventListener('seeked', () => res(), { once: true });
      v.currentTime = want;
    }))).then(() => {});
  };
  window.__ready = Promise.all([document.fonts.ready, ...Array.from(document.images).map(i => i.decode().catch(() => {})),
    ...VIDS.map(({ v }) => new Promise((res) => { if (v.readyState >= 2) res(); else { v.addEventListener('loadeddata', res, { once: true }); v.addEventListener('error', res, { once: true }); } }))]);
  if (!/render=1/.test(location.search)) { tl.play(0); tl.eventCallback('onComplete', () => tl.play(0)); }
})();
</script>
