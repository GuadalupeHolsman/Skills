<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tap in — V3 Same party</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-600.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-800.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-900.woff2") format("woff2"); }
      :root { --blue: #2e33c8; --navy: #151a7a; --yellow: #fcee21; }
      body { margin: 0; background: #1d22a3; font-family: "Montserrat", sans-serif; color: #fff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0d3a; }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; }
      .y { color: var(--yellow); }
      .chrome-top { position: absolute; left: 64px; right: 64px; top: 88px; height: 52px; border-bottom: 2px solid rgba(255,255,255,0.55); display: flex; justify-content: space-between; align-items: flex-start; font-weight: 800; font-size: 27px; letter-spacing: 0.2em; }
      .chrome-top .date { color: var(--yellow); }
      .chrome-bot { position: absolute; left: 64px; right: 64px; top: 1778px; height: 60px; border-top: 2px solid rgba(255,255,255,0.55); display: flex; justify-content: space-between; align-items: flex-end; font-weight: 800; font-size: 27px; letter-spacing: 0.2em; }

      /* split screen: each panel shows a clean (text-free) region of the source, scaled up */
      .panel { position: absolute; left: 0; width: 1080px; height: 960px; overflow: hidden; }
      .panel.top { top: 0; }
      .panel.bot { top: 960px; }
      .crop { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
      .crop video { position: absolute; inset: 0; width: 100%; height: 100%; }
      .crop-top { transform: translate(-270px, -1680px) scale(1.5); filter: grayscale(1) brightness(2.1) contrast(1.35); }
      .crop-bot { transform: translate(-370px, -253px) scale(1.684); filter: saturate(1.25) brightness(1.05); }

      /* phone-camera UI over the top panel */
      .vf { position: absolute; left: 64px; right: 64px; top: 190px; bottom: 1060px; }
      .vf i { position: absolute; width: 70px; height: 70px; border-color: rgba(255,255,255,0.85); border-style: solid; border-width: 0; }
      .vf .tl { left: 0; top: 0; border-left-width: 6px; border-top-width: 6px; }
      .vf .tr { right: 0; top: 0; border-right-width: 6px; border-top-width: 6px; }
      .vf .bl { left: 0; bottom: 0; border-left-width: 6px; border-bottom-width: 6px; }
      .vf .br { right: 0; bottom: 0; border-right-width: 6px; border-bottom-width: 6px; }
      .rec { position: absolute; left: 100px; top: 222px; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: 0.12em; }
      .rec .dot { width: 26px; height: 26px; border-radius: 50%; background: #ff3b3b; }
      .notif { position: absolute; left: 120px; width: 840px; height: 112px; border-radius: 30px; background: rgba(248,248,255,0.94); box-shadow: 0 14px 30px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 22px; padding: 0 26px; box-sizing: border-box; color: #14163a; }
      .notif .ic { width: 64px; height: 64px; border-radius: 18px; flex: 0 0 64px; }
      .notif .t { font-weight: 800; font-size: 27px; }
      .notif .b { font-weight: 600; font-size: 25px; color: #33365a; white-space: nowrap; }
      .tag { position: absolute; left: 64px; padding: 12px 24px; border-radius: 40px; font-weight: 800; font-size: 30px; letter-spacing: 0.18em; }
      .tag.gray { top: 830px; background: rgba(255,255,255,0.9); color: #222; }
      .tag.yel { top: 1660px; background: var(--yellow); color: var(--navy); }

      /* centre hook band */
      .cband { position: absolute; left: 0; right: 0; top: 880px; height: 160px; background: var(--blue); border-top: 6px solid var(--yellow); border-bottom: 6px solid var(--yellow); box-sizing: border-box; overflow: hidden; }
      .cband .txt { position: absolute; left: 64px; right: 40px; top: 0; bottom: 0; display: flex; align-items: center; font-weight: 900; font-size: 92px; letter-spacing: -0.03em; white-space: nowrap; }

      .lband { position: absolute; left: 0; right: 0; top: 1594px; height: 194px; background: var(--yellow); overflow: hidden; }
      .lband .txt { position: absolute; left: 64px; top: 0; height: 194px; display: flex; align-items: center; font-weight: 900; font-size: 92px; letter-spacing: -0.02em; color: var(--navy); white-space: nowrap; }
      .mband { position: absolute; left: 0; right: 0; top: 676px; height: 456px; background: var(--blue); border-top: 6px solid var(--yellow); border-bottom: 6px solid var(--yellow); box-sizing: border-box; overflow: hidden; }
      .mband.alt { background: var(--yellow); border-color: var(--blue); color: var(--navy); }
      .mband .txt { position: absolute; left: 64px; right: 40px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; font-weight: 900; font-size: 160px; line-height: 0.92; letter-spacing: -0.03em; }
      .mband .txt span { display: block; }
      .mband.alt .txt .y { color: var(--blue); }

      .cta { position: absolute; left: 64px; right: 64px; top: 1250px; font-weight: 800; font-size: 72px; line-height: 1.1; letter-spacing: -0.01em; }
      .cta span { display: block; }
      .cta .arrow { display: inline-block; width: 92px; height: 92px; margin-top: 26px; border-radius: 50%; background: var(--yellow); color: var(--navy); font-size: 56px; line-height: 92px; text-align: center; font-weight: 900; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="12.58">

      <!-- Split screen (0 – 3.36): phones up vs phones down, both in slow motion -->
      <div class="panel top"><div class="crop crop-top" data-layout-allow-overflow>
        <video id="top-v" src="assets/src.mp4" muted playsinline data-start="0" data-duration="3.36" data-media-start="4.00" data-playback-rate="0.55" data-track-index="0"></video>
      </div></div>
      <div class="panel bot"><div class="crop crop-bot" data-layout-allow-overflow>
        <video id="bot-v" src="assets/src.mp4" muted playsinline data-start="0" data-duration="3.36" data-media-start="12.60" data-playback-rate="0.5" data-track-index="0"></video>
      </div></div>
      <div id="s1" class="layer clip" data-start="0" data-duration="3.36" data-track-index="1">
        <div class="vf"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
        <div class="rec"><span id="recdot" class="dot"></span><span>REC 00:00:14</span></div>
        <div class="notif" id="n0" style="top:330px"><div class="ic" style="background:#ff4d7d"></div><div><div class="t">Group chat</div><div class="b">“send me the video”</div></div></div>
        <div class="notif" id="n1" style="top:460px"><div class="ic" style="background:#ff8a1f"></div><div><div class="t">Feed</div><div class="b">Your story has 3 new views</div></div></div>
        <div class="notif" id="n2" style="top:590px"><div class="ic" style="background:#8b5cf6"></div><div><div class="t">Mail</div><div class="b">Re: Re: Re: urgent</div></div></div>
        <div id="tag1" class="tag gray">PHONES UP</div>
        <div id="tag2" class="tag yel">PHONES DOWN</div>
        <div class="chrome-top"><span>INVITE ONLY</span><span class="date">29.10</span></div>
        <div class="chrome-bot"><span>LOOMLOCK × DON JULIO</span><span>+18</span></div>
        <div id="cband" class="cband">
          <div id="ct1" class="txt">Same party.</div>
          <div id="ct2" class="txt y">Different night.</div>
        </div>
      </div>

      <!-- Tap + lock (3.36 – 5.57), original 10.30 → 12.51 -->
      <video id="v-phone" class="full" src="assets/src.mp4" muted playsinline data-start="3.36" data-duration="2.21" data-media-start="10.30" data-track-index="0"></video>
      <div id="s2" class="layer clip" data-start="3.36" data-duration="1.97" data-track-index="1">
        <div id="lband" class="lband"><div id="lt1" class="txt">Tap in.</div><div id="lt2" class="txt">Phones down.</div></div>
      </div>

      <!-- Full-screen party (5.57 – 8.93) -->
      <video id="m1" class="full" src="assets/src.mp4" muted playsinline data-start="5.57" data-duration="1.68" data-media-start="12.57" data-track-index="0"></video>
      <video id="m2" class="full" src="assets/src.mp4" muted playsinline data-start="7.25" data-duration="1.68" data-media-start="2.00" data-track-index="0"></video>
      <div id="b1" class="layer clip" data-start="5.57" data-duration="1.68" data-track-index="1"><div class="mband"><div id="bt1" class="txt"><span>Same</span><span class="y">party.</span></div></div></div>
      <div id="b2" class="layer clip" data-start="7.25" data-duration="1.68" data-track-index="1"><div class="mband alt"><div id="bt2" class="txt"><span>Better</span><span class="y">night.</span></div></div></div>

      <!-- End card (8.93 – 12.58) -->
      <video id="v-end" class="full" src="assets/src.mp4" muted playsinline data-start="8.93" data-duration="3.65" data-media-start="16.35" data-track-index="0"></video>
      <div id="s5" class="layer clip" data-start="9.7" data-duration="2.88" data-track-index="1">
        <div class="cta"><span id="c1">Who’s your +1?</span><span id="c2" class="y">Send this to them.</span><span id="c3" class="arrow">↗</span></div>
      </div>

      <!-- Audio -->
      <audio id="music" src="assets/music_full.wav" data-start="0" data-duration="12.58" data-media-start="6.94" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.15,"v":0.9},{"t":12.1,"v":1},{"t":12.58,"v":0}]}]}'></audio>
      <audio id="sx-p0" src="assets/sfx/ping.wav" data-start="0.5" data-volume="0.6"></audio>
      <audio id="sx-p1" src="assets/sfx/ping.wav" data-start="1.1" data-volume="0.6"></audio>
      <audio id="sx-p2" src="assets/sfx/ping.wav" data-start="1.7" data-volume="0.6"></audio>
      <audio id="sx-w" src="assets/sfx/whoosh.wav" data-start="2.9" data-volume="0.8"></audio>
      <audio id="sx-c1" src="assets/sfx/click.wav" data-start="3.73" data-volume="1"></audio>
      <audio id="sx-c2" src="assets/sfx/click.wav" data-start="4.39" data-volume="0.8"></audio>
      <audio id="sx-c3" src="assets/sfx/click.wav" data-start="4.73" data-volume="1"></audio>
      <audio id="sx-im" src="assets/sfx/impact.wav" data-start="5.57" data-volume="0.9"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cband", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo("#ct1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2 }, 0.15);
      tl.set("#ct2", { opacity: 0 }, 0);
      tl.to("#ct1", { opacity: 0, y: -50, duration: 0.14 }, 1.6);
      tl.fromTo("#ct2", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, 1.68);
      tl.fromTo("#recdot", { opacity: 1 }, { opacity: 0.15, duration: 0.3, yoyo: true, repeat: 9, ease: "steps(1)" }, 0);
      [["#n0", 0.5], ["#n1", 1.1], ["#n2", 1.7]].forEach(([s, t]) => {
        tl.fromTo(s, { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "back.out(1.6)" }, t);
      });
      tl.fromTo("#tag1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.2 }, 0.3);
      tl.fromTo("#tag2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.2 }, 0.5);
      tl.to(["#n0", "#n1", "#n2", "#cband"], { opacity: 0, duration: 0.2 }, 3.1);

      tl.fromTo("#lband", { xPercent: -100 }, { xPercent: 0, duration: 0.22, ease: "power3.out" }, 3.36);
      tl.fromTo("#lt1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.18 }, 3.45);
      tl.set("#lt2", { opacity: 0 }, 0);
      tl.to("#lt1", { opacity: 0, y: -40, duration: 0.12 }, 4.31);
      tl.fromTo("#lt2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, 4.39);
      tl.to("#lband", { xPercent: 100, duration: 0.18, ease: "power3.in" }, 5.17);

      [["#bt1", 5.57], ["#bt2", 7.25]].forEach(([s, t]) => {
        tl.fromTo(s, { scale: 1.18, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.14, ease: "power4.out" }, t);
      });

      tl.fromTo("#c1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 9.7);
      tl.fromTo("#c2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 9.94);
      tl.fromTo("#c3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 10.18);
      tl.to("#c3", { x: 10, y: -10, duration: 0.24, ease: "power2.inOut", yoyo: true, repeat: 3 }, 10.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
